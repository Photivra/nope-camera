<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 725" width="980" height="725" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Export, Share Without Optional Details and Delete All Captures</title><desc id="d">Three screens: choosing As Saved or Share Without Optional Details before the share sheet, the summary of the copy with what stays in the file, and the Delete All Captures confirmation.</desc><rect width="980" height="725" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Getting captures out, Share Without Optional Details and Delete All (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every export is started by the person and makes a copy. Draft wording. &quot;Share Without Optional Details&quot; replaces the earlier name &quot;Share Clean&quot;.</text><rect x="24" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Share</text><text x="56" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >SHARE A COPY</text><rect x="40" y="136" width="268" height="132" rx="12" fill="#1c1c1e" /><text x="56" y="158" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >As Saved</text><text x="56" y="176" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every detail in the file, and its signature.</text><text x="290" y="174.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><rect x="56" y="201.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="224" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Share Without Optional Details</text><text x="56" y="242" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >A copy with the optional details removed.</text><text x="56" y="286" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy leaves nope.&#x27;s protection. The app</text><text x="56" y="301" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >or place you send it to keeps its own copy.</text><text x="56" y="316" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The capture in nope. is not changed.</text><rect x="40" y="338" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="366" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >File name</text><text x="292" y="366" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >8F3K2QXD.dng</text><text x="56" y="402" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The name holds the date and time only when</text><text x="56" y="417" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >the file itself holds them.</text><rect x="40" y="439" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="467" font-size="14.5" font-weight="600" fill="#40c8e0" text-anchor="start" >Continue</text><text x="40" y="509" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. Before the share sheet</text><text x="40" y="525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >The share sheet that follows has no Copy, Save</text><text x="40" y="541" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Image, Assign to Contact or Print.</text><rect x="340" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="358" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹</text><text x="490.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Without Optional Details</text><text x="372" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >IN THE COPY</text><rect x="356" y="136" width="268" height="276" rx="12" fill="#1c1c1e" /><text x="372" y="164" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Camera settings</text><text x="608" y="164" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="181.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="210" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lens</text><text x="608" y="210" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="227.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="256" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Date and time</text><text x="608" y="256" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="273.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="302" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Location</text><text x="608" y="302" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Not in the file</text><rect x="372" y="319.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="348" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Signature</text><text x="608" y="348" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="365.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="394" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >File name</text><text x="608" y="394" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >8F3K2QXD.dng</text><text x="372" y="430" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy is not signed: a signature does</text><text x="372" y="445" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >not survive a change to the file.</text><text x="372" y="481" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >WHAT STAYS IN THE FILE</text><text x="372" y="497" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Color and size data that the file needs to</text><text x="372" y="512" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >open can point to the phone model, and</text><text x="372" y="527" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >possibly to the individual phone. Every</text><text x="372" y="542" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >camera sensor also leaves a faint, unique</text><text x="372" y="557" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >noise pattern in the picture. With enough</text><text x="372" y="572" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >of your photos, forensic tools can match</text><text x="372" y="587" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >them to the same camera. No app can fully</text><text x="372" y="602" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >remove it. The picture itself is not</text><text x="372" y="617" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >changed.</text><text x="356" y="649" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The summary, read back from the copy</text><text x="356" y="665" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >A row says Removed only when the stored file</text><text x="356" y="681" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >held that detail; otherwise Not in the file.</text><rect x="656" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="674" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="806.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="676" y="200" width="260" height="278" rx="22" fill="#2c2c2e" /><text x="806" y="232" font-size="16" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Delete 9 Captures?</text><text x="806" y="256" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >This deletes every capture kept in</text><text x="806" y="272" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >nope. It can&#x27;t be undone. It does</text><text x="806" y="288" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >not reach copies in Photos, in</text><text x="806" y="304" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >iCloud, in backups or already</text><text x="806" y="320" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >shared. Restoring an earlier backup</text><text x="806" y="336" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >brings back the captures that were</text><text x="806" y="352" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >in it.</text><rect x="692" y="376" width="228" height="38" rx="19" fill="#48484a" /><text x="806" y="400" font-size="14.5" font-weight="600" fill="#ff6961" text-anchor="middle" >Delete 9 Captures</text><rect x="692" y="420" width="228" height="38" rx="19" fill="#48484a" /><text x="806" y="444" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Cancel</text><text x="672" y="534" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. Delete All Captures: count and limits stated</text></svg>
