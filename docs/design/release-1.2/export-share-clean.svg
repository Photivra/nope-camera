<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 725" width="664" height="725" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Sharing from Captures and Delete All Captures</title><desc id="d">Two screens: the share step for a capture kept in the app, shown when When Sharing is Ask Each Time, and the Delete All Captures confirmation. The summary of the copy is in release 1.1, share-copy.svg.</desc><rect width="664" height="725" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Getting captures out and Delete All (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >The step and the summary are release 1.1.0&#x27;s (issue 132). Draft wording.</text><rect x="24" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Share</text><text x="56" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >SHARE A COPY</text><rect x="40" y="136" width="268" height="132" rx="12" fill="#1c1c1e" /><text x="56" y="158" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Share Without Optional Details</text><text x="56" y="176" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >A copy with the optional details removed.</text><rect x="56" y="201.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="224" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >As Saved</text><text x="56" y="242" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every detail in the file, and its signature.</text><text x="56" y="286" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy leaves nope.&#x27;s protection. The app</text><text x="56" y="301" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >or place you send it to keeps its own copy.</text><text x="56" y="316" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The capture in nope. is not changed.</text><rect x="40" y="338" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="366" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >File name</text><text x="292" y="366" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >8F3K2QXD.dng</text><text x="56" y="402" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The name holds the date and time only when</text><text x="56" y="417" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >the file itself holds them.</text><rect x="40" y="439" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="467" font-size="14.5" font-weight="600" fill="#636366" text-anchor="start" >Continue</text><text x="40" y="509" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. The step, from Captures (Ask Each Time)</text><text x="40" y="525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Neither option is selected. The note is the</text><text x="40" y="541" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >store&#x27;s (string 30). Summary: release 1.1.</text><rect x="340" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="358" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="490" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="360" y="200" width="260" height="278" rx="22" fill="#2c2c2e" /><text x="490" y="232" font-size="16" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Delete 9 Captures?</text><text x="490" y="256" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >This deletes every capture kept in</text><text x="490" y="272" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >nope. It can&#x27;t be undone. It does</text><text x="490" y="288" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >not reach copies in Photos, in</text><text x="490" y="304" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >iCloud, in backups or already</text><text x="490" y="320" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >shared. Restoring an earlier backup</text><text x="490" y="336" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >brings back the captures that were</text><text x="490" y="352" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >in it.</text><rect x="376" y="376" width="228" height="38" rx="19" fill="#48484a" /><text x="490" y="400" font-size="14.5" font-weight="600" fill="#ff6961" text-anchor="middle" >Delete 9 Captures</text><rect x="376" y="420" width="228" height="38" rx="19" fill="#48484a" /><text x="490" y="444" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Cancel</text><text x="356" y="534" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. Delete All Captures: count and limits stated</text></svg>