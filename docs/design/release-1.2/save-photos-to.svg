<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 854" width="1296" height="854" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Save Photos To and Lock Captures in Settings</title><desc id="d">Four panels: the Privacy group with the two new rows, which the Lock Screen camera&#x27;s Settings does not show; the Save Photos To page; the Lock Captures page; and the question about backups asked the first time nope only is chosen.</desc><rect width="1296" height="854" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Save Photos To and Lock Captures (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Settings › Privacy gains two rows above Assistant Access. Draft wording until the device checks and the Honesty review; text that names a backup kind follows research step R4.</text><rect x="24" y="72" width="300" height="764" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Settings</text><text x="56" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >PRIVACY</text><rect x="40" y="136" width="268" height="250" rx="12" fill="#1c1c1e" /><text x="56" y="158" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Details in Each Photo</text><text x="56" y="176" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >All Optional Removed</text><text x="292" y="164" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="201.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="230" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Sign Each Photo</text><rect x="244" y="211.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="258" cy="225.0" r="12" fill="#fff" /><rect x="56" y="247.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="276" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Save Photos To</text><text x="278" y="276" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >nope only</text><text x="292" y="276" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="293.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="322" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lock Captures</text><text x="278" y="322" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Off</text><text x="292" y="322" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="339.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="368" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Assistant Access</text><text x="278" y="368" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Off</text><text x="292" y="368" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><text x="40" y="410" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. The Privacy group: five rows</text><text x="40" y="426" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >In the Lock Screen camera&#x27;s Settings the group</text><text x="40" y="442" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >has three rows: Save Photos To and Lock</text><text x="40" y="458" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Captures are not shown there.</text><rect x="340" y="72" width="300" height="764" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="358" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="490.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="356" y="124" width="268" height="92" rx="12" fill="#1c1c1e" /><text x="372" y="152" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Photos</text><rect x="372" y="169.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="198" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >nope only</text><text x="606" y="198.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><text x="372" y="234" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >New photos are kept in nope. and are not</text><text x="372" y="249" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >added to Photos. They are in this iPhone&#x27;s</text><text x="372" y="264" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >backups, including iCloud Backup. Photos</text><text x="372" y="279" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >already in Photos stay there: nope. can add</text><text x="372" y="294" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >photos but can&#x27;t read or move them.</text><text x="372" y="330" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >KEPT IN NOPE.</text><rect x="356" y="338" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="366" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Captures</text><text x="594" y="366" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >9 · 232 MB</text><text x="608" y="366" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><text x="372" y="402" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Deleting the app deletes these. Export the</text><text x="372" y="417" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >ones you want to keep.</text><rect x="356" y="439" width="268" height="92" rx="12" fill="#1c1c1e" /><text x="372" y="467" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Leave Out of Backups</text><rect x="560" y="448.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="574" cy="462.0" r="12" fill="#fff" /><rect x="372" y="484.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="513" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Neutral File Names</text><rect x="560" y="494.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="574" cy="508.0" r="12" fill="#fff" /><text x="372" y="549" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >nope. asks iOS to leave these captures out</text><text x="372" y="564" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >of this iPhone&#x27;s backups. iOS treats this</text><text x="372" y="579" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >as a request, not a guarantee, and it does</text><text x="372" y="594" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >not cover a copy of the phone&#x27;s storage</text><text x="372" y="609" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >made another way. Left out, captures are</text><text x="372" y="624" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >lost if the phone is lost and do not move</text><text x="372" y="639" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >to a new phone.</text><rect x="356" y="661" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="689" font-size="14.5" font-weight="400" fill="#ff6961" text-anchor="start" >Delete All Captures…</text><text x="356" y="731" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The Save Photos To page</text><text x="356" y="747" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Shown with the answer &quot;Keep in Backups&quot;. With</text><text x="356" y="763" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Lock Captures on, the Captures row shows no</text><text x="356" y="779" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >count or size.</text><rect x="656" y="72" width="300" height="764" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="674" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="806.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Lock Captures</text><rect x="672" y="124" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="688" y="152" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lock Captures</text><rect x="876" y="133.0" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="910" cy="147.0" r="12" fill="#fff" /><text x="688" y="188" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Viewing, sharing and deleting captures kept</text><text x="688" y="203" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >in nope. asks for Face ID or the passcode.</text><text x="688" y="218" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Taking photos never asks, and the camera</text><text x="688" y="233" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >screen shows no picture of a capture kept</text><text x="688" y="248" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >in nope.</text><text x="688" y="284" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >LOCK AGAIN</text><rect x="672" y="292" width="268" height="138" rx="12" fill="#1c1c1e" /><text x="688" y="320" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Immediately</text><text x="922" y="320.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><rect x="688" y="337.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="366" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >After 1 Minute</text><rect x="688" y="383.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="412" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >After 5 Minutes</text><text x="688" y="448" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The time counts from when you leave nope.</text><text x="688" y="463" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Captures always lock again when you go back</text><text x="688" y="478" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >to the camera, when the iPhone locks, and</text><text x="688" y="493" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >when nope. is closed.</text><rect x="672" y="515" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="688" y="543" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Passcode Only</text><rect x="876" y="524.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="890" cy="538.0" r="12" fill="#fff" /><text x="688" y="579" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Face ID can be used by someone holding the</text><text x="688" y="594" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >phone to your face. With this on, only the</text><text x="688" y="609" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >passcode opens your captures.</text><text x="688" y="639" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >A gate inside the app, not encryption.</text><text x="688" y="654" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Anyone with the iPhone&#x27;s passcode can open</text><text x="688" y="669" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >it. It does not cover copies in Photos or</text><text x="688" y="684" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >already shared, and it does not stop</text><text x="688" y="699" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >someone with the unlocked iPhone from</text><text x="688" y="714" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >deleting nope. and every capture in it.</text><text x="672" y="746" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. The Lock Captures page</text><text x="672" y="762" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Lock Again is built only if a device check</text><text x="672" y="778" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >shows that a lock of the iPhone inside the</text><text x="672" y="794" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >delay is detected. Otherwise the section is</text><text x="672" y="810" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >left out and captures always lock at once.</text><rect x="972" y="72" width="300" height="764" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="990" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="1122.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="992" y="190" width="260" height="306" rx="22" fill="#2c2c2e" /><text x="1122" y="222" font-size="16" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Keep Captures in This</text><text x="1122" y="242" font-size="16" font-weight="600" fill="#f2f2f7" text-anchor="middle" >iPhone&#x27;s Backups?</text><text x="1122" y="266" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >Captures kept in nope. are not in</text><text x="1122" y="282" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >Photos. In backups, they can be</text><text x="1122" y="298" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >restored to a new phone, and anyone</text><text x="1122" y="314" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >who can open the backup can read</text><text x="1122" y="330" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >them. Left out, they are lost if</text><text x="1122" y="346" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >the phone is lost or replaced.</text><rect x="1008" y="370" width="228" height="38" rx="19" fill="#48484a" /><text x="1122" y="394" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Keep in Backups</text><rect x="1008" y="414" width="228" height="38" rx="19" fill="#48484a" /><text x="1122" y="438" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Leave Out of Backups</text><rect x="1008" y="458" width="228" height="38" rx="19" fill="#48484a" /><text x="1122" y="482" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Cancel</text><text x="988" y="572" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >D. Asked once, the first time nope only is chosen</text><text x="988" y="588" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Neither answer is preselected or emphasized.</text><text x="988" y="604" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Cancel leaves Save Photos To on Photos. The</text><text x="988" y="620" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >footer in B states the answer.</text></svg>
