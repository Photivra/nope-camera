<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 1010" width="1296" height="1010" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">High-Risk Checklist in Settings, and the backup question with the Advanced Data Protection limits</title><desc id="d">Four panels: the Privacy group with a High-Risk Checklist row; the top of the checklist page, a static list with no checkmarks, switches or status, whose first row opens a page on the ways others may try to get photos; the rest of the page, including the ways to get captures off the phone, with its closing sentences; and the backup question with the rewritten paragraph about Advanced Data Protection.</desc><rect x="0" y="0" width="1296" height="1010" rx="0" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">High-Risk Checklist, with ways to get captures off the phone, and the Advanced Data Protection limits (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">A static page in Settings › Privacy. Draft wording until the device checks and the Honesty review. Who sees the row and where it sits are open decisions 30 and 31; the recommended options are drawn.</text><rect x="24" y="72" width="300" height="780" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1"/><text x="174" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">Settings</text><text x="56" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">PRIVACY</text><rect x="40" y="136" width="268" height="310" rx="12" fill="#1c1c1e"/><text x="56" y="165" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Details in Each Photo</text><text x="292" y="165" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end">›</text><rect x="56" y="181.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="56" y="211" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Sign Each Photo</text><rect x="244" y="191" width="48" height="28" rx="14" fill="#39393d"/><circle cx="258" cy="205" r="12" fill="#fff"/><rect x="56" y="227.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="56" y="257" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Save Photos To</text><text x="292" y="257" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end">nope only ›</text><rect x="56" y="273.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="56" y="303" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Lock Captures</text><text x="292" y="303" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end">On ›</text><rect x="56" y="319.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="56" y="349" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Assistant Access</text><text x="292" y="349" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end">Off ›</text><rect x="56" y="365.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="56" y="395" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start">High-Risk Checklist</text><text x="292" y="395" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end">›</text><text x="56" y="411" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">iPhone settings and habits. nope.</text><text x="56" y="426.5" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">can&#x27;t see or change them.</text><rect x="44" y="368" width="260" height="76" rx="10" fill="none" stroke="#64d2ff" stroke-width="1"/><text x="40" y="872" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. The Privacy group: six rows</text><text x="40" y="888" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">A plain row with no value: the app has no status</text><text x="40" y="904" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">to show. Not shown in the Lock Screen camera&#x27;s</text><text x="40" y="920" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Settings. The outline marks the new row and is not</text><text x="40" y="936" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">drawn in the app.</text><rect x="342" y="72" width="300" height="780" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1"/><text x="492" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">High-Risk Checklist</text><text x="374" y="138" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">Most of what protects the photos on this</text><text x="374" y="153.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">iPhone comes from iOS and its passcode,</text><text x="374" y="169.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">not from nope. These are settings and</text><text x="374" y="184.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">habits that Apple documents. nope. can&#x27;t</text><text x="374" y="200.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">see or change any of them, and doesn&#x27;t</text><text x="374" y="215.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">know which you use.</text><rect x="358" y="233.0" width="268" height="50" rx="12" fill="#1c1c1e"/><text x="374" y="254.0" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Ways Others May Try to Get</text><text x="374" y="271.0" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Your Photos</text><text x="610" y="263.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end">›</text><text x="374" y="305.0" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">THIS IPHONE</text><rect x="358" y="313.0" width="268" height="497.0" rx="12" fill="#1c1c1e"/><text x="374" y="333.0" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Use a longer passcode</text><text x="374" y="350.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">iOS protection of a locked iPhone rests</text><text x="374" y="365.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">on the passcode. A longer one with</text><text x="374" y="381.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">letters and numbers takes longer to</text><text x="374" y="396.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">guess.</text><text x="374" y="414.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Settings app › Face ID &amp; Passcode ›</text><text x="374" y="429.5" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Change Passcode › Passcode Options ›</text><text x="374" y="445.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Custom Alphanumeric Code</text><text x="374" y="464.5" font-size="11.5" font-weight="500" fill="#64d2ff" text-anchor="start" text-decoration="underline">Apple: Set a passcode ↗</text><text x="374" y="502.5" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Turn on Stolen Device Protection</text><text x="374" y="519.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">Away from familiar places such as home or</text><text x="374" y="535.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">work, iOS asks for Face ID with no</text><text x="374" y="550.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">passcode fallback for some actions, and</text><text x="374" y="566.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">waits an hour before some changes.</text><text x="374" y="583.5" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Settings app › Face ID &amp; Passcode ›</text><text x="374" y="599.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Stolen Device Protection</text><text x="374" y="618.5" font-size="11.5" font-weight="500" fill="#64d2ff" text-anchor="start" text-decoration="underline">Apple: Stolen Device Protection ↗</text><text x="374" y="656.5" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Set a short Auto-Lock</text><text x="374" y="673.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">Auto-Lock sets how long the iPhone waits</text><text x="374" y="689.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">before it locks itself. iOS protection</text><text x="374" y="704.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">for captures kept in nope. starts a few</text><text x="374" y="720.0" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">seconds after the iPhone locks, not</text><text x="374" y="735.5" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start">before.</text><text x="374" y="753.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Settings app › Display &amp; Brightness ›</text><text x="374" y="768.5" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Auto-Lock</text><text x="374" y="788.0" font-size="11.5" font-weight="500" fill="#64d2ff" text-anchor="start" text-decoration="underline">Apple: Auto-Lock ↗</text><rect x="374" y="482.5" width="252" height="0.5" rx="0" fill="#38383a"/><rect x="374" y="636.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="358" y="872" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. The page: text only</text><text x="358" y="888" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">No checkmarks, switches or status. The first row</text><text x="358" y="904" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">opens a second static page: the known routes, what</text><text x="358" y="920" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">helps, what nope. can&#x27;t do. Each item: what it is,</text><text x="358" y="936" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">where to go in words, Apple&#x27;s page (decision 35).</text><text x="358" y="952" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Continues in C.</text><rect x="660" y="72" width="300" height="780" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1"/><text x="810" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">High-Risk Checklist</text><text x="692" y="132" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">THIS IPHONE (CONTINUED)</text><rect x="676" y="140" width="268" height="60" rx="12" fill="#1c1c1e"/><text x="692" y="160" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Consider Erase Data</text><rect x="692" y="169.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="190" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Consider Lockdown Mode</text><text x="692" y="222" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">IF THE IPHONE MAY BE TAKEN</text><rect x="676" y="230" width="268" height="60" rx="12" fill="#1c1c1e"/><text x="692" y="250" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Turn off Face ID quickly</text><rect x="692" y="259.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="280" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Restart or turn off the iPhone</text><text x="692" y="312" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">BACKUPS</text><rect x="676" y="320" width="268" height="60" rx="12" fill="#1c1c1e"/><text x="692" y="340" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Consider Advanced Data Protection</text><rect x="692" y="349.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="370" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Encrypt backups to a computer</text><text x="692" y="402" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">GETTING CAPTURES OFF THIS IPHONE</text><rect x="676" y="410" width="268" height="180" rx="12" fill="#1c1c1e"/><text x="692" y="430" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Send in an encrypted messaging app</text><rect x="692" y="439.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="460" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Save to storage you trust</text><rect x="692" y="469.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="490" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">AirDrop to your own device</text><rect x="692" y="499.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="520" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Back up to a computer, encrypted</text><rect x="692" y="529.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="550" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Use your organization&#x27;s documentation tool</text><rect x="692" y="559.5" width="252" height="0.5" rx="0" fill="#38383a"/><text x="692" y="580" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Then keep fewer captures in nope.</text><text x="692" y="612" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">NOPE.</text><rect x="676" y="620" width="268" height="30" rx="12" fill="#1c1c1e"/><text x="692" y="640" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Update nope. yourself</text><text x="692" y="668" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">This list is not complete, and it is not</text><text x="692" y="683.5" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">advice for your situation. Apple can</text><text x="692" y="699.0" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">change these settings. Checked against</text><text x="692" y="714.5" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">Apple&#x27;s support pages in November 2026,</text><text x="692" y="730.0" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">for iOS 27.</text><text x="692" y="751.5" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">Links open Apple&#x27;s website in your</text><text x="692" y="767.0" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">browser. nope. itself makes no network</text><text x="692" y="782.5" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">connection.</text><text x="676" y="872" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">C. The rest of the page</text><text x="676" y="888" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Titles only in this sketch; each item is laid out</text><text x="676" y="904" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">as in B. Five headings, sixteen items, two closing</text><text x="676" y="920" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">sentences. No third-party app or service is named.</text><rect x="978" y="72" width="300" height="780" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1"/><text x="1128" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">Save Photos To</text><rect x="992" y="130" width="272" height="530" rx="18" fill="#2c2c2e"/><text x="1128" y="160" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">Keep Captures in This</text><text x="1128" y="180" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle">iPhone&#x27;s Backups?</text><text x="1128" y="206" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">Captures kept in nope. are not in</text><text x="1128" y="221.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">Photos. In backups, they can be restored</text><text x="1128" y="237.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">to a new phone, and anyone who can open</text><text x="1128" y="252.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">the backup can read them. Left out, they</text><text x="1128" y="268.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">are lost if the phone is lost or</text><text x="1128" y="283.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">replaced.</text><text x="1128" y="307.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">Apple&#x27;s Advanced Data Protection</text><text x="1128" y="322.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">end-to-end encrypts iCloud Backup, so</text><text x="1128" y="338.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">only your trusted devices hold the keys.</text><text x="1128" y="353.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">Apple can still read some details, such</text><text x="1128" y="369.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">as each backup&#x27;s date, time and size and</text><text x="1128" y="384.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">which apps are in it. It does not cover</text><text x="1128" y="400.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">backups to a computer, needs a recovery</text><text x="1128" y="415.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">contact or key, and is not available</text><text x="1128" y="431.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">everywhere. You turn it on in the</text><text x="1128" y="446.5" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">Settings app. nope. can&#x27;t tell whether</text><text x="1128" y="462.0" font-size="12" font-weight="400" fill="#d1d1d6" text-anchor="middle">it&#x27;s on.</text><text x="1128" y="485.5" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="middle">More in Settings › Privacy › High-Risk</text><text x="1128" y="501.0" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="middle">Checklist.</text><rect x="1014" y="522.5" width="228" height="36" rx="18" fill="#48484a"/><text x="1128" y="545.5" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle">Keep in Backups</text><rect x="1014" y="564.5" width="228" height="36" rx="18" fill="#48484a"/><text x="1128" y="587.5" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle">Leave Out of Backups</text><rect x="1014" y="606.5" width="228" height="36" rx="18" fill="#48484a"/><text x="1128" y="629.5" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle">Cancel</text><text x="994" y="872" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">D. The backup question, string 44a rewritten</text><text x="994" y="888" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The second paragraph states the limits. The</text><text x="994" y="904" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">pointer is words, not a link, so nothing leads out</text><text x="994" y="920" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">of the question before it is answered (decision</text><text x="994" y="936" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">32). At large text sizes the message scrolls above</text><text x="994" y="952" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">the buttons.</text></svg>
