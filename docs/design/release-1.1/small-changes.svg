<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Three small changes: the DNG preview in Photo Details, Photos could not be opened, and an out-of-date Live Activity</title><desc id="d">Three panels: the What's in This Photo rows for a RAW file with its embedded preview, the viewer's message when Photos could not be opened, and the Live Activity when its information is out of date.</desc><rect width="1000" height="470" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">Three small changes on screen (issues 131, 148, 150)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Draft wording for the Honesty review.</text><rect x="24" y="84" width="304.0" height="290" rx="16" fill="#000" stroke="#2c2c2e" stroke-width="1"/><text x="40" y="110" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start">WHAT'S IN THIS PHOTO</text><rect x="36" y="120" width="280.0" height="170" rx="12" fill="#1c1c1e"/><text x="50" y="148" font-size="13.5" font-weight="400" fill="#f2f2f7" text-anchor="start">RAW image data</text><text x="302.0" y="148" font-size="13" font-weight="400" fill="#aeaeb2" text-anchor="end">DNG, 12 MP</text><text x="50" y="192" font-size="13.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Preview for file browsers</text><text x="302.0" y="192" font-size="13" font-weight="400" fill="#aeaeb2" text-anchor="end">JPEG, 1024 px</text><rect x="50" y="164" width="266.0" height="0.5" rx="0" fill="#38383a"/><text x="50" y="236" font-size="13.5" font-weight="400" fill="#f2f2f7" text-anchor="start">Signature</text><text x="302.0" y="236" font-size="13" font-weight="400" fill="#aeaeb2" text-anchor="end">Signed</text><rect x="50" y="208" width="266.0" height="0.5" rx="0" fill="#38383a"/><text x="50" y="266.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">1 RAW file · 24.6 MB, of which preview 0.2 MB</text><text x="40" y="312.0" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">The preview is a small processed picture that</text><text x="40" y="327.525" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">nope. makes from the same RAW data, so Finder</text><text x="40" y="343.05" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">and Files can show a thumbnail. The RAW data</text><text x="40" y="358.575" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start">is not changed by it.</text><text x="24" y="398" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. A RAW file's preview (issue 131)</text><text x="24" y="416.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">One new row, and the size line names the preview.</text><text x="24" y="431.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The same sentence is on the Honesty screen.</text><rect x="348.0" y="84" width="304.0" height="290" rx="16" fill="#000" stroke="#2c2c2e" stroke-width="1"/><clipPath id="c1"><rect x="348.0" y="84" width="304.0" height="150" rx="16"/></clipPath><g clip-path="url(#c1)"><linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FC9"/><stop offset="0.55" stop-color="#C9D8E6"/><stop offset="0.75" stop-color="#F1D9A8"/></linearGradient><clipPath id="c3"><rect x="348.0" y="84" width="304.0" height="190"/></clipPath><g clip-path="url(#c3)"><rect x="348.0" y="84" width="304.0" height="190" rx="0" fill="url(#c2)"/><circle cx="566.88" cy="152.39999999999998" r="18.24" fill="#FFF3C4"/><path d="M348.0 220.79999999999998 L424.0 182.8 L484.8 213.20000000000002 L560.8 175.2 L652.0 217.0 L652.0 274 L348.0 274 Z" fill="#4C6B57"/><path d="M348.0 243.6 L454.4 217.0 L545.6 239.79999999999998 L652.0 224.6 L652.0 274 L348.0 274 Z" fill="#2E4637"/></g></g><rect x="362.0" y="250" width="276.0" height="40" rx="12" fill="#000" stroke="#FF9F0A" stroke-width="1.5"/><text x="376.0" y="275" font-size="11" font-weight="700" fill="#FF9F0A" text-anchor="start">▲</text><text x="392.0" y="275" font-size="13" font-weight="600" fill="#FF9F0A" text-anchor="start">Photos couldn't be opened.</text><circle cx="384.0" cy="332" r="20" fill="#333333"/><line x1="378.0" y1="326" x2="390.0" y2="338" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="390.0" y1="326" x2="378.0" y2="338" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="430.0" y="316" width="96" height="32" rx="16" fill="#333333"/><text x="478.0" y="337" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Photo Details</text><rect x="532.0" y="316" width="106" height="32" rx="16" fill="#333333"/><text x="585.0" y="337" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Open in Photos</text><text x="348.0" y="398" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. Photos did not open (issue 148)</text><text x="348.0" y="416.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">If iOS reports that Photos did not open, the</text><text x="348.0" y="431.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">viewer says so with the warning symbol and words;</text><text x="348.0" y="447.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">VoiceOver reads it once. The button stays. The</text><text x="348.0" y="462.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">same sentence shows on the camera for Open Photos.</text><rect x="672.0" y="84" width="304.0" height="290" rx="16" fill="#1a1a1c" stroke="#2c2c2e" stroke-width="1"/><rect x="686.0" y="100" width="276.0" height="96" rx="22" fill="#2c2c2e"/><text x="702.0" y="130" font-size="12" font-weight="700" fill="#fff" text-anchor="start">nope.</text><text x="946.0" y="130" font-size="12" font-weight="600" fill="#40C8E0" text-anchor="end">Running</text><text x="702.0" y="156" font-size="15" font-weight="600" fill="#fff" text-anchor="start">Photo 12 of 40</text><text x="702.0" y="178" font-size="12.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Next in 0:24</text><text x="688.0" y="214" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Current</text><rect x="686.0" y="232" width="276.0" height="96" rx="22" fill="#2c2c2e"/><text x="702.0" y="262" font-size="12" font-weight="700" fill="#fff" text-anchor="start">nope.</text><text x="946.0" y="262" font-size="12" font-weight="600" fill="#FF9F0A" text-anchor="end">May be out of date</text><text x="702.0" y="288" font-size="14" font-weight="600" fill="#fff" text-anchor="start">Photo 12 of 40 when last updated</text><text x="702.0" y="310" font-size="12.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Open nope. to see the series</text><text x="688.0" y="346" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">After the stale date passed with no update</text><text x="672.0" y="398" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">C. Live Activity, out of date (issue 150)</text><text x="672.0" y="416.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Each update sets a stale date a little after the</text><text x="672.0" y="431.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">next expected change. Past it, the activity stops</text><text x="672.0" y="447.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">saying Running and stops counting down.</text></svg>
