<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Export, Share clean and Delete All Captures</title><desc id="d">Three screens: choosing As Saved or Share Clean before the share sheet, the Share Clean summary, and the Delete All Captures confirmation.</desc><rect width="980" height="610" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Getting captures out, Share clean and Delete All (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every export is started by the person and makes a copy. Draft wording.</text><rect x="24" y="72" width="300" height="520" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Share</text><text x="56" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >SHARE A COPY</text><rect x="40" y="146" width="268" height="132" rx="12" fill="#1c1c1e" /><text x="56" y="168" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >As Saved</text><text x="56" y="186" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every detail in the file, and its signature.</text><text x="290" y="184.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><rect x="56" y="211.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="234" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Share Clean</text><text x="56" y="252" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Optional details removed from the copy.</text><text x="56" y="296" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy leaves nope.&#x27;s protection. The</text><text x="56" y="311" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >capture in nope. is not changed.</text><rect x="40" y="334" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="362.0" font-size="14.5" font-weight="600" fill="#40c8e0" text-anchor="start" >Continue</text><text x="40" y="560" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. Before the share sheet</text><rect x="340" y="72" width="300" height="520" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="358" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Share</text><text x="490.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Share Clean</text><text x="372" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >IN THE COPY</text><rect x="356" y="146" width="268" height="230" rx="12" fill="#1c1c1e" /><text x="372" y="174.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Camera settings</text><text x="608" y="174.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="191.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="220.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lens</text><text x="608" y="220.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="237.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="266.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Date and time</text><text x="608" y="266.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="372" y="283.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="312.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Location</text><text x="608" y="312.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Not in the file</text><rect x="372" y="329.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="358.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Signature</text><text x="608" y="358.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><text x="372" y="394" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy is not signed: a signature does not</text><text x="372" y="409" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >survive a change to the file.</text><rect x="356" y="432" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="460.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >What Stays in the File</text><text x="594" y="460.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" ></text><text x="608" y="460.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><text x="372" y="496" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Color and size data that the file needs to</text><text x="372" y="511" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >open can point to the phone model. The</text><text x="372" y="526" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >picture itself is not changed.</text><text x="356" y="560" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The summary, read back from the copy</text><rect x="656" y="72" width="300" height="520" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="674" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="806.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="656" y="72" width="300" height="520" rx="28" fill="#000" opacity=".55"/><rect x="676" y="220" width="260" height="236" rx="22" fill="#2c2c2e" /><text x="806" y="252" font-size="16" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Delete 9 Captures?</text><text x="806" y="276" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >This deletes every capture kept in</text><text x="806" y="292" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >nope., now. It can&#x27;t be undone.</text><text x="806" y="308" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >It does not reach copies in Photos,</text><text x="806" y="324" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >in iCloud, in backups or already</text><text x="806" y="340" font-size="12.5" font-weight="400" fill="#d1d1d6" text-anchor="middle" >shared.</text><rect x="692" y="364" width="228" height="38" rx="19" fill="#48484a" /><text x="806" y="388" font-size="14.5" font-weight="600" fill="#ff6961" text-anchor="middle" >Delete 9 Captures</text><rect x="692" y="408" width="228" height="38" rx="19" fill="#48484a" /><text x="806" y="432" font-size="14.5" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Cancel</text><text x="672" y="560" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. Delete All Captures: count and limits stated</text></svg>
