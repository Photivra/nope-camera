<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958.0 603.0" width="958.0" height="603.0" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The Welcome screen says photos can be cryptographically signed</title><desc id="d">The Welcome screen today and as proposed, with the changed second statement outlined, and a list of the other places the wording changes.</desc><rect width="958.0" height="603.0" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">Welcome: "cryptographically sign" (issue 139)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">One statement changes on the Welcome screen. Draft wording for the Honesty review; the dashed outline marks the statement, and is not part of the screen.</text><clipPath id="c1"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(24,96) scale(0.5)"><g clip-path="url(#c1)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="201" y="250" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">nope.</text><text x="40" y="330" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">Photos with as little processing as</text><text x="40" y="354" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">this phone allows.</text><text x="40" y="400" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">You can sign each photo, so changes</text><text x="40" y="424" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">can be detected. Signing is off until</text><text x="40" y="448" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">you turn it on.</text><rect x="28" y="378" width="346" height="84" rx="10" fill="none" stroke="#FF9F0A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="40" y="494" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">nope. never connects to the internet</text><text x="40" y="518" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">and collects nothing about you.</text><rect x="32" y="730" width="338" height="52" rx="26" fill="#FFFFFF"/><text x="201" y="763" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">Continue</text><text x="201" y="808" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="middle">Next, iOS asks for camera access. Photos access is</text><text x="201" y="825" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="middle">asked the first time you save.</text></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><text x="24" y="555.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. Today (1.0.0)</text><clipPath id="c2"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(253.0,96) scale(0.5)"><g clip-path="url(#c2)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="201" y="250" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">nope.</text><text x="40" y="330" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">Photos with as little processing as</text><text x="40" y="354" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">this phone allows.</text><text x="40" y="400" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">You can cryptographically sign each</text><text x="40" y="424" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">photo, so anyone can check that the</text><text x="40" y="448" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">file hasn't changed since it was</text><text x="40" y="472" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">signed. Signing is off until you turn</text><text x="40" y="496" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">it on.</text><rect x="28" y="378" width="346" height="132" rx="10" fill="none" stroke="#FF9F0A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="40" y="542" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">nope. never connects to the internet</text><text x="40" y="566" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">and collects nothing about you.</text><rect x="32" y="730" width="338" height="52" rx="26" fill="#FFFFFF"/><text x="201" y="763" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">Continue</text><text x="201" y="808" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="middle">Next, iOS asks for camera access. Photos access is</text><text x="201" y="825" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="middle">asked the first time you save.</text></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><text x="253.0" y="555.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. Proposed (string 130)</text><text x="482.0" y="112" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">Where else the wording changes</text><text x="482.0" y="132" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Sign Each Photo, its explanation (string 131)</text><text x="482.0" y="149.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Adds a cryptographic signature to each photo. It lets anyone check that the</text><text x="482.0" y="164.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">photo hasn't changed since it was signed. The signature names nope. and its</text><text x="482.0" y="180.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">version as the maker. It is not proof: anyone could make a file that says the</text><text x="482.0" y="195.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">same.</text><text x="482.0" y="223.1" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Honesty, Signing Is Your Choice (string 132)</text><text x="482.0" y="240.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Photos aren't signed unless you turn on Sign Each Photo in nope.'s settings. A</text><text x="482.0" y="255.625" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">cryptographically signed photo lets anyone check that it hasn't changed since</text><text x="482.0" y="271.15" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">it was signed. (The rest is unchanged.)</text><text x="482.0" y="298.675" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">The guide's page on signing, and the store description</text><text x="482.0" y="315.675" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The first mention on each says "cryptographically sign"; later mentions say</text><text x="482.0" y="331.2" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">"sign".</text><text x="482.0" y="358.725" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">Not changed</text><text x="482.0" y="375.725" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Short status words: Signed, Not Signed, Saved and signed. The VoiceOver</text><text x="482.0" y="391.25" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">results, the watch and Siri answers, and Photo Details, which already names</text><text x="482.0" y="406.77500000000003" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Content Credentials.</text><text x="482.0" y="434.3" font-size="12" font-weight="600" fill="#f2f2f7" text-anchor="start">"Since it was signed", not "since it was taken"</text><text x="482.0" y="451.3" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The signature is made when the file is written, a moment after capture. It</text><text x="482.0" y="466.825" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">shows whether the file changed after that; it can't speak for the moment of</text><text x="482.0" y="482.35" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">capture.</text></svg>
