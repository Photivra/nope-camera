<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 640" width="664" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The Lock Screen camera notice in Settings, and the privacy cover</title><desc id="d">Two screens: a Settings page with the notice that the Lock Screen camera has not received a change, with Try Again; and the cover shown in place of the camera while the app is not active.</desc><rect width="664" height="640" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >The settings copy notice (issue 134) and the privacy cover (issue 136)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Draft wording. Amber is used only with its symbol and words. The cover holds nothing of the screen.</text><rect x="24" y="72" width="300" height="470" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="42" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Privacy</text><text x="174" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Details in Each Photo</text><rect x="40" y="128" width="268" height="128" rx="12" fill="#2a2110" stroke="#ffb340" stroke-width="1" /><text x="56" y="152" font-size="15" font-weight="600" fill="#ffb340" text-anchor="start" >⚠</text><text x="78" y="152" font-size="12.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >The Lock Screen camera hasn&#x27;t</text><text x="78" y="169" font-size="12.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >received this change. It is still</text><text x="78" y="186" font-size="12.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >using your earlier settings.</text><rect x="56" y="208" width="236" height="34" rx="17" fill="#48484a" /><text x="174" y="230" font-size="14" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Try Again</text><rect x="40" y="272" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="56" y="300" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Remove All Optional Details</text><rect x="260" y="285" width="34" height="20" rx="10" fill="#48484a" /><rect x="262" y="287" width="16" height="16" rx="8" fill="#f2f2f7" /><rect x="40" y="334" width="268" height="92" rx="12" fill="#1c1c1e" /><text x="56" y="362" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Location</text><rect x="260" y="347" width="34" height="20" rx="10" fill="#34c759" /><rect x="276" y="349" width="16" height="16" rx="8" fill="#f2f2f7" /><rect x="56" y="379.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="408" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Date and Time</text><rect x="260" y="393" width="34" height="20" rx="10" fill="#48484a" /><rect x="262" y="395" width="16" height="16" rx="8" fill="#f2f2f7" /><text x="40" y="566" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. A change that has not arrived</text><text x="40" y="582" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Shown on every Settings page and the list</text><text x="40" y="598" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >until a hand-off is confirmed. Not on the</text><text x="40" y="614" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >camera screen, and not in Q.</text><rect x="340" y="72" width="300" height="470" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><circle cx="490" cy="300" r="34" fill="none" stroke="#f2f2f7" stroke-width="2"/><text x="486" y="312" font-size="34" font-weight="600" fill="#f2f2f7" text-anchor="middle" >n</text><circle cx="503" cy="309" r="3.5" fill="#40c8e0"/><text x="356" y="566" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The cover, while the app is not active</text><text x="356" y="582" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >The app&#x27;s black with its mark, as at launch;</text><text x="356" y="598" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >red in Night Mode. It is drawn over the</text><text x="356" y="614" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >camera, the viewer, Photo Details, Compare</text><text x="356" y="630" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >and the share step. No text.</text></svg>