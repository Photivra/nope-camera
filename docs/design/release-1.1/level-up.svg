<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The two-axis level when the device points straight up</title><desc id="d">The level shown when the device points straight up: tilted, level, and a diagram of the angles at which the top-down level, the horizon level and the up level show.</desc><rect width="1000" height="540" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">Level: a two-axis level when pointing straight up (issue 152)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">The same figure as the top-down level: a fixed ring, and an inner circle that moves toward the side that is raised, as it looks on the screen.</text><text x="24" y="72" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Same angles (in within 25°, out beyond 35°), same tolerance (level within 1.0°, released at 1.5°), same tap, and its own VoiceOver words.</text><clipPath id="c1"><rect x="24" y="100" width="220" height="220" rx="14"/></clipPath><g clip-path="url(#c1)"><linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6FA8"/><stop offset="1" stop-color="#9DB9D6"/></linearGradient><rect x="24" y="100" width="220" height="220" rx="0" fill="url(#c2)"/><line x1="24" y1="144.0" x2="123.0" y2="192.39999999999998" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="244" y1="122.0" x2="156.0" y2="210.0" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="68.0" y1="320" x2="134.0" y2="236.4" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="244" y1="287.0" x2="160.4" y2="221.0" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/></g><circle cx="134.0" cy="210.0" r="30" fill="none" stroke="#000000" stroke-width="4"/><circle cx="134.0" cy="210.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="160.0" cy="196.0" r="22" fill="none" stroke="#000000" stroke-width="4"/><circle cx="160.0" cy="196.0" r="22" fill="none" stroke="#FFFFFF" stroke-width="2"/><line x1="128.0" y1="210.0" x2="140.0" y2="210.0" stroke="#FFFFFF" stroke-width="1.5"/><line x1="134.0" y1="204.0" x2="134.0" y2="216.0" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="340" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. Pointing up, tilted</text><text x="24" y="356.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The inner circle is off center.</text><text x="24" y="371.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">VoiceOver value: "Pointing up, not</text><text x="24" y="387.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">level".</text><clipPath id="c3"><rect x="274" y="100" width="220" height="220" rx="14"/></clipPath><g clip-path="url(#c3)"><linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6FA8"/><stop offset="1" stop-color="#9DB9D6"/></linearGradient><rect x="274" y="100" width="220" height="220" rx="0" fill="url(#c4)"/><line x1="274" y1="144.0" x2="373.0" y2="192.39999999999998" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="494" y1="122.0" x2="406.0" y2="210.0" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="318.0" y1="320" x2="384.0" y2="236.4" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/><line x1="494" y1="287.0" x2="410.4" y2="221.0" stroke="#2E3B2A" stroke-width="7" stroke-linecap="round"/></g><circle cx="384.0" cy="210.0" r="30" fill="none" stroke="#000000" stroke-width="6"/><circle cx="384.0" cy="210.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="4"/><circle cx="384.0" cy="210.0" r="22" fill="none" stroke="#000000" stroke-width="6"/><circle cx="384.0" cy="210.0" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/><line x1="378.0" y1="210.0" x2="390.0" y2="210.0" stroke="#FFFFFF" stroke-width="1.5"/><line x1="384.0" y1="204.0" x2="384.0" y2="216.0" stroke="#FFFFFF" stroke-width="1.5"/><text x="274" y="340" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. Pointing straight up, level</text><text x="274" y="356.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Both axes within 1.0°: the circles</text><text x="274" y="371.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">meet and thicken, and the level tap</text><text x="274" y="387.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">plays on iPhone. VoiceOver: "Pointing</text><text x="274" y="402.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">straight up, level".</text><path d="M760.0 380.0 A130 130 0 0 0 814.9 367.8" fill="none" stroke="#40C8E0" stroke-width="10"/><path d="M814.9 367.8 A130 130 0 0 0 834.6 356.5" fill="none" stroke="#40C8E0" stroke-width="3"/><path d="M834.6 356.5 A130 130 0 0 0 834.6 143.5" fill="none" stroke="#8E8E93" stroke-width="10"/><path d="M834.6 143.5 A130 130 0 0 0 814.9 132.2" fill="none" stroke="#FF9F0A" stroke-width="3"/><path d="M814.9 132.2 A130 130 0 0 0 760.0 120.0" fill="none" stroke="#FF9F0A" stroke-width="10"/><line x1="760" y1="106" x2="760" y2="394" stroke="#3a3a3c" stroke-width="1" stroke-dasharray="4 4"/><rect x="751" y="216" width="18" height="68" rx="5" fill="#1C1C1E" stroke="#f2f2f7" stroke-width="1.5"/><text x="760" y="98" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="middle">straight up (180°)</text><text x="760" y="410" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="middle">straight down (0°)</text><text x="904" y="370.9" font-size="11" font-weight="400" fill="#40C8E0" text-anchor="start">Top-down level: in at 25°, out at 35°</text><text x="904" y="254" font-size="11" font-weight="400" fill="#c7c7cc" text-anchor="start">Horizon level</text><text x="904" y="133.0" font-size="11" font-weight="400" fill="#FF9F0A" text-anchor="start">Up level (new): in at 25°</text><text x="904" y="148.0" font-size="11" font-weight="400" fill="#FF9F0A" text-anchor="start">from straight up, out at 35°</text><text x="600" y="446" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">C. Where each level shows</text><text x="600" y="464.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The angle is between the back camera's direction and</text><text x="600" y="479.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">straight down. Between the thick and thin parts of an arc</text><text x="600" y="495.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">the level that is showing stays (hysteresis). Colors here</text><text x="600" y="510.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">only tell the three ranges apart; on screen all three</text><text x="600" y="526.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">levels are white, red in Night Mode.</text></svg>
