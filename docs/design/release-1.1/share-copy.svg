<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 725" width="980" height="725" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">When Sharing, the share step and the summary of the copy</title><desc id="d">Three screens: the When Sharing setting with its three choices and footer, the share step shown with Ask Each Time, and the summary of a copy without optional details.</desc><rect width="980" height="725" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Sharing a copy: When Sharing, the step and the summary (issue 132)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Draft wording. As Saved is the default. The step is shown only with Ask Each Time; neither option is selected.</text><rect x="24" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="42" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Privacy</text><text x="174" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >When Sharing</text><rect x="40" y="136" width="268" height="138" rx="12" fill="#1c1c1e" /><text x="56" y="164" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >As Saved</text><text x="290" y="164" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><rect x="56" y="181.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="210" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Without Optional Details</text><rect x="56" y="227.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="256" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Ask Each Time</text><text x="56" y="294" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >As Saved shares the file as it is, with every</text><text x="56" y="309" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >detail in it and its signature. Without</text><text x="56" y="324" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Optional Details shares a copy with those</text><text x="56" y="339" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >details removed. The copy has no date and</text><text x="56" y="354" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >no signature, so it suits publishing, not a</text><text x="56" y="369" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >record. Every camera sensor also leaves a</text><text x="56" y="384" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >faint, unique noise pattern in the picture.</text><text x="56" y="399" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >With enough of your photos, forensic tools</text><text x="56" y="414" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >can match them to the same camera. No app</text><text x="56" y="429" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >can fully remove it. This applies to Share</text><text x="56" y="444" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >in nope., not to sharing from the Photos</text><text x="56" y="459" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >app.</text><text x="40" y="509" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. Settings › Privacy › When Sharing</text><text x="40" y="525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >As Saved is the default. Factory Defaults</text><text x="40" y="541" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >returns to it; presets do not store it. The</text><text x="40" y="557" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Lock Screen camera reads it from its copy</text><text x="40" y="573" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >of the settings.</text><rect x="340" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="490" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Share a Copy</text><text x="372" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >CHOOSE ONE</text><rect x="356" y="136" width="268" height="150" rx="12" fill="#1c1c1e" /><text x="372" y="158" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Share Without Optional Details</text><text x="372" y="176" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >A copy with the optional details removed.</text><text x="372" y="191" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >It has no date and no signature.</text><rect x="372" y="217.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="240" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >As Saved</text><text x="372" y="258" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Every detail in the file, and its signature.</text><text x="372" y="306" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The app or place you send it to keeps its</text><text x="372" y="321" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >own copy. The photo in Photos is not</text><text x="372" y="336" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >changed.</text><rect x="356" y="360" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="388" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >File name</text><text x="608" y="388" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >8F3K2QXD.heic</text><text x="372" y="424" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The name holds the date and time only when</text><text x="372" y="439" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >the file itself holds them.</text><rect x="356" y="461" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="489" font-size="14.5" font-weight="600" fill="#636366" text-anchor="start" >Continue</text><text x="356" y="531" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The step, with Ask Each Time</text><text x="356" y="547" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Neither option is selected. Continue is</text><text x="356" y="563" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >unavailable until one is chosen. The share</text><text x="356" y="579" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >sheet that follows has no Copy.</text><rect x="656" y="72" width="300" height="635" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="674" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹</text><text x="806" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Without Optional Details</text><text x="688" y="128" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >IN THE COPY</text><rect x="672" y="136" width="268" height="276" rx="12" fill="#1c1c1e" /><text x="688" y="164" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Camera settings</text><text x="924" y="164" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="688" y="181.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="210" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lens</text><text x="924" y="210" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="688" y="227.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="256" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Date and time</text><text x="924" y="256" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="688" y="273.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="302" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Location</text><text x="924" y="302" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Not in the file</text><rect x="688" y="319.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="348" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Signature</text><text x="924" y="348" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Removed</text><rect x="688" y="365.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="394" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >File name</text><text x="924" y="394" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >8F3K2QXD.heic</text><text x="688" y="430" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >The copy is not signed: a signature does</text><text x="688" y="445" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >not survive a change to the file.</text><text x="688" y="472" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >WHAT STAYS IN THE FILE</text><text x="688" y="488" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Color and size data that the file needs to</text><text x="688" y="503" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >open can point to the phone model, and</text><text x="688" y="518" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >possibly to the individual phone. Every</text><text x="688" y="533" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >camera sensor also leaves a faint, unique</text><text x="688" y="548" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >noise pattern in the picture. With enough</text><text x="688" y="563" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >of your photos, forensic tools can match</text><text x="688" y="578" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >them to the same camera. No app can fully</text><text x="688" y="593" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >remove it. The picture itself is not</text><text x="688" y="608" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >changed.</text><rect x="672" y="628" width="268" height="40" rx="12" fill="#1c1c1e" /><text x="688" y="653" font-size="14.5" font-weight="600" fill="#40c8e0" text-anchor="start" >Continue</text><text x="672" y="690" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. The summary, read back from the copy</text></svg>