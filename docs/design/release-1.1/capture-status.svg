ont-weight="700" fill="#000" text-anchor="middle" >3</text><circle cx="762" cy="446" r="30" fill="none" stroke="#ffffff" stroke-width="4" /><circle cx="762" cy="446" r="23" fill="#ffffff" /><text x="640" y="502" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >Only if step 3 of the plan is built: a</text><text x="640" y="516" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >count of photos still saving.</text></svg>
