<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 560" width="948" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The Last Photo spot from press to saved</title><desc id="d">Six panels: press, captured, saving with the photo&#x27;s dimmed preview and a ring, saved, not saved with an amber mark, and a count when several photos are still saving.</desc><rect width="948" height="560" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >The Last Photo spot from press to saved (issue 129)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Capture feedback marks the capture only. The word Saved, the seal and the saved haptic appear only after the photo is confirmed in its destination.</text><rect x="24" y="76" width="276" height="212" rx="16" fill="#1c1c1e" /><text x="40" y="102" font-size="14" font-weight="600" fill="#f2f2f7" text-anchor="start" >1 · Press</text><defs><linearGradient id="p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8fbf"/><stop offset="1" stop-color="#27465f"/></linearGradient></defs><rect x="40" y="116" width="244" height="56" rx="0" fill="url(#p0)" /><path d="M40 150.72L108.32000000000001 137.28L162.0 146.8L215.68 132.8L284 149.6V172H40Z" fill="#1d3345" opacity=".85"/><rect x="40" y="172" width="244" height="76" rx="0" fill="#000" /><rect x="54" y="184" width="52" height="52" rx="10" fill="#000" /><defs><linearGradient id="gprev" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f8fbf"/><stop offset="1" stop-color="#27465f"/></linearGradient><clipPath id="cprev"><rect x="54" y="184" width="52" height="52" rx="10"/></clipPath></defs><rect x="54" y="184" width="52" height="52" rx="10" fill="url(#gprev)" /><circle cx="162" cy="210" r="30" fill="none" stroke="#ffffff" stroke-width="4" /><circle cx="162" cy="210" r="23" fill="#ffffff" /><text x="40" y="266" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >Shutter haptic (exists). The spot is</text><text x="40" y="280" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >unchanged.</text><rect x="324" y="76" width="276" height="212" rx="16" fill="#1c1c1e" /><text x="340" y="102" font-size="14" font-weight="600" fill="#f2f2f7" text-anchor="start" >2 · Captured</text><defs><linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8fbf"/><stop offset="1" stop-color="#27465f"/></linearGradient></defs><rect x="340" y="116" width="244" height="56" rx="0" fill="url(#p1)" /><path d="M340 150.72L408.32 137.28L462.0 146.8L515.6800000000001 132.8L584 149.6V172H340Z" fill="#1d3345" opacity=".85"/><rect x="340" y="116" width="244" height="56" rx="0" fill="#000" opacity=".75"/><rect x="340" y="172" width="244" height="76" rx="0" fill="#000" /><rect x="354" y="184" width="52" height="52" rx="10" fill="#000" /><defs><linearGradient id="gblink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f8fbf"/><stop offset="1" stop-color="#27465f"/></linearGradient><clipPath id="cblink"><rect x="354" y="184" width="52" height="52" rx="10"/></clipPath></defs><rect x="354" y="184" width="52" height="52" rx="10" fill="url(#gblink)" /><circle cx="462" cy="210" r="30" fill="none" stroke="#ffffff" stroke-width="4" /><circle cx="462" cy="210" r="23" fill="#ffffff" /><circle cx="462" cy="210" r="23" fill="#000" opacity=".6"/><text x="340" y="266" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >Picture dims for 0.1 s. Sound if Shutter</text><text x="340" y="280" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >Sound is on.</text><rect x="624" y="76" width="276" height="212" rx="16" fill="#1c1c1e" /><text x="640" y="102" font-size="14" font-weight="600" fill="#f2f2f7" text-anchor="start" >3 · Saving</text><defs><linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" 