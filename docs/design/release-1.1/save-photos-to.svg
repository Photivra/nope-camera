<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" width="980" height="730" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Save Photos To and Lock Captures in Settings</title><desc id="d">Three Settings pages: the Privacy group with the two new rows, the Save Photos To page, and the Lock Captures page.</desc><rect width="980" height="730" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Save Photos To and Lock Captures (issue 83)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Settings › Privacy gains two rows above Assistant Access. Both pages are draft wording until the device checks and the Honesty review.</text><rect x="24" y="72" width="300" height="640" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Settings</text><text x="56" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >PRIVACY</text><rect x="40" y="146" width="268" height="246" rx="12" fill="#1c1c1e" /><text x="56" y="168" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Details in Each Photo</text><text x="56" y="186" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >All Optional Removed</text><text x="278" y="168" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" ></text><text x="292" y="168" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="207.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="236.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Sign Each Photo</text><rect x="244" y="217.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="258" cy="231.0" r="12" fill="#fff" /><rect x="56" y="253.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="282.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Save Photos To</text><text x="278" y="282.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >nope only</text><text x="292" y="282.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="299.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="328.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lock Captures</text><text x="278" y="328.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Off</text><text x="292" y="328.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="345.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="374.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Assistant Access</text><text x="278" y="374.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Off</text><text x="292" y="374.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><text x="40" y="414" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. The Privacy group: five rows</text><rect x="340" y="72" width="300" height="640" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="358" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="490.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Save Photos To</text><rect x="356" y="124" width="268" height="92" rx="12" fill="#1c1c1e" /><text x="372" y="152.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Photos</text><rect x="372" y="169.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="198.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >nope only</text><text x="606" y="198.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><text x="372" y="234" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >New photos are kept in nope. and are not</text><text x="372" y="249" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >added to Photos. Photos already in Photos</text><text x="372" y="264" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >stay there: nope. can add photos but can&#x27;t</text><text x="372" y="279" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >read or move them.</text><text x="372" y="316" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >KEPT IN NOPE.</text><rect x="356" y="324" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="352.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Captures</text><text x="594" y="352.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >9 · 232 MB</text><text x="608" y="352.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><text x="372" y="388" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Deleting the app deletes these. Export the</text><text x="372" y="403" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >ones you want to keep.</text><rect x="356" y="426" width="268" height="92" rx="12" fill="#1c1c1e" /><text x="372" y="454.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Leave Out of Backups</text><rect x="560" y="435.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="574" cy="449.0" r="12" fill="#fff" /><rect x="372" y="471.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="500.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Neutral File Names</text><rect x="560" y="481.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="574" cy="495.0" r="12" fill="#fff" /><text x="372" y="536" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Captures are in iPhone and iCloud backups</text><text x="372" y="551" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >unless left out. Left out, they are lost with</text><text x="372" y="566" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >the phone.</text><rect x="356" y="589" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="372" y="617.0" font-size="14.5" font-weight="400" fill="#ff6961" text-anchor="start" >Delete All Captures…</text><text x="356" y="653" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. The Save Photos To page</text><rect x="656" y="72" width="300" height="640" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="674" y="110" font-size="14" font-weight="400" fill="#40c8e0" text-anchor="start" >‹ Settings</text><text x="806.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Lock Captures</text><rect x="672" y="124" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="688" y="152.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Lock Captures</text><rect x="876" y="133.0" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="910" cy="147.0" r="12" fill="#fff" /><text x="688" y="188" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Viewing, sharing and deleting captures kept</text><text x="688" y="203" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >in nope. asks for Face ID or the passcode.</text><text x="688" y="218" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Taking photos never asks.</text><text x="688" y="255" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >LOCK AGAIN</text><rect x="672" y="263" width="268" height="138" rx="12" fill="#1c1c1e" /><text x="688" y="291.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Immediately</text><text x="922" y="291.0" font-size="15" font-weight="600" fill="#40c8e0" text-anchor="end" >✓</text><rect x="688" y="308.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="337.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >After 1 Minute</text><rect x="688" y="354.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="383.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >After 5 Minutes</text><text x="688" y="419" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Always locked after the app is closed or the</text><text x="688" y="434" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >iPhone locks.</text><rect x="672" y="457" width="268" height="46" rx="12" fill="#1c1c1e" /><text x="688" y="485.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Passcode Only</text><rect x="876" y="466.0" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="890" cy="480.0" r="12" fill="#fff" /><text x="688" y="521" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >A gate inside the app, not encryption.</text><text x="688" y="536" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >Anyone with the iPhone&#x27;s passcode can open</text><text x="688" y="551" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >it. It does not cover copies in Photos or</text><text x="688" y="566" font-size="11.5" font-weight="400" fill="#8e8e93" text-anchor="start" >already shared.</text><text x="672" y="593" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. The Lock Captures page</text></svg>
