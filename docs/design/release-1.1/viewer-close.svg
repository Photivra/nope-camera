<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1007.0 653.0" width="1007.0" height="653.0" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The viewer's Close button sits exactly where Last Photo was</title><desc id="d">The camera screen and the Last Photo viewer side by side with guide lines through the Last Photo button and the Close button, and the viewer with three actions.</desc><rect width="1007.0" height="653.0" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">Viewer: Close exactly where Last Photo was (issue 143)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Opening the viewer and closing it again are one tap in one place. The guide lines pass through the center of Last Photo and of Close.</text><clipPath id="c1"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(24,96) scale(0.5)"><g clip-path="url(#c1)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><rect x="16" y="68" width="58" height="28" rx="14" fill="none" stroke="#40C8E0" stroke-width="1.5"/><text x="45" y="87" font-size="13" font-weight="600" fill="#40C8E0" text-anchor="middle">RAW</text><text x="86" y="87" font-size="13" font-weight="600" fill="#B0B0B0" text-anchor="start">12 MP</text><rect x="274.0" y="68" width="112.0" height="28" rx="14" fill="none" stroke="#FF9F0A" stroke-width="1.5"/><text x="286.0" y="87" font-size="11" font-weight="700" fill="#FF9F0A" text-anchor="start">▲</text><text x="301.0" y="87" font-size="13" font-weight="600" fill="#FF9F0A" text-anchor="start">Not Signed</text><linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FC9"/><stop offset="0.55" stop-color="#C9D8E6"/><stop offset="0.75" stop-color="#F1D9A8"/></linearGradient><clipPath id="c3"><rect x="0" y="106" width="402" height="536"/></clipPath><g clip-path="url(#c3)"><rect x="0" y="106" width="402" height="536" rx="0" fill="url(#c2)"/><circle cx="289.44" cy="298.96" r="24.119999999999997" fill="#FFF3C4"/><path d="M0 491.91999999999996 L100.5 384.72 L180.9 470.48 L281.4 363.28 L402 481.2 L402 642 L0 642 Z" fill="#4C6B57"/><path d="M0 556.24 L140.7 481.2 L261.3 545.52 L402 502.64 L402 642 L0 642 Z" fill="#2E4637"/></g><rect x="12" y="594" width="132" height="36" rx="12" fill="#0F0F0F" fill-opacity="0.9"/><text x="78" y="617" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">1/120 · ISO 50</text><rect x="113" y="648" width="176" height="44" rx="22" fill="#333333"/><text x="137.0" y="675" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">0.5</text><rect x="159.7" y="652" width="40" height="36" rx="18" fill="#FFFFFF"/><text x="179.7" y="675" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">1×</text><text x="222.4" y="675" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="265.1" y="675" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><rect x="28" y="704" width="68" height="32" rx="16" fill="#FFFFFF"/><text x="62" y="725" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">Single</text><text x="132" y="725" font-size="15" font-weight="600" fill="#D4D4D4" text-anchor="middle">Timer</text><text x="198" y="725" font-size="15" font-weight="600" fill="#D4D4D4" text-anchor="middle">Burst</text><text x="270" y="725" font-size="15" font-weight="600" fill="#D4D4D4" text-anchor="middle">Bracket</text><text x="348" y="725" font-size="15" font-weight="600" fill="#D4D4D4" text-anchor="middle">Interval</text><clipPath id="c4"><rect x="32" y="768" width="52" height="52" rx="12"/></clipPath><g clip-path="url(#c4)"><linearGradient id="c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FC9"/><stop offset="0.55" stop-color="#C9D8E6"/><stop offset="0.75" stop-color="#F1D9A8"/></linearGradient><clipPath id="c6"><rect x="32" y="768" width="52" height="52"/></clipPath><g clip-path="url(#c6)"><rect x="32" y="768" width="52" height="52" rx="0" fill="url(#c5)"/><circle cx="69.44" cy="786.72" r="3.12" fill="#FFF3C4"/><path d="M32 805.44 L45.0 795.04 L55.400000000000006 803.36 L68.4 792.96 L84 804.4 L84 820 L32 820 Z" fill="#4C6B57"/><path d="M32 811.68 L50.2 804.4 L65.80000000000001 810.64 L84 806.48 L84 820 L32 820 Z" fill="#2E4637"/></g></g><rect x="32" y="768" width="52" height="52" rx="12" fill="none" stroke="#B0B0B0" stroke-width="1"/><circle cx="201" cy="794" r="36" fill="none" stroke="#FFFFFF" stroke-width="4"/><circle cx="201" cy="794" r="30" fill="#FFFFFF"/><circle cx="344" cy="794" r="26" fill="#333333"/><text x="344" y="801" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q</text><rect x="134" y="858" width="134" height="5" rx="2.5" fill="#FFFFFF"/></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><clipPath id="c7"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(253.0,96) scale(0.5)"><g clip-path="url(#c7)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="201" y="90" font-size="15" font-weight="600" fill="#40C8E0" text-anchor="middle">✓ Signed</text><linearGradient id="c8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FC9"/><stop offset="0.55" stop-color="#C9D8E6"/><stop offset="0.75" stop-color="#F1D9A8"/></linearGradient><clipPath id="c9"><rect x="0" y="106" width="402" height="536"/></clipPath><g clip-path="url(#c9)"><rect x="0" y="106" width="402" height="536" rx="0" fill="url(#c8)"/><circle cx="289.44" cy="298.96" r="24.119999999999997" fill="#FFF3C4"/><path d="M0 491.91999999999996 L100.5 384.72 L180.9 470.48 L281.4 363.28 L402 481.2 L402 642 L0 642 Z" fill="#4C6B57"/><path d="M0 556.24 L140.7 481.2 L261.3 545.52 L402 502.64 L402 642 L0 642 Z" fill="#2E4637"/></g><text x="201" y="672" font-size="13" font-weight="600" fill="#B0B0B0" text-anchor="middle">1 of 3 · RAW + HEIF · 12 MP</text><circle cx="58" cy="794" r="26" fill="#333333"/><line x1="49" y1="785" x2="67" y2="803" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><line x1="67" y1="785" x2="49" y2="803" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><rect x="234" y="776.0" width="136" height="36" rx="18" fill="#333333"/><text x="302.0" y="799.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open in Photos</text><rect x="102" y="776.0" width="124" height="36" rx="18" fill="#333333"/><text x="164.0" y="799.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Photo Details</text><rect x="134" y="858" width="134" height="5" rx="2.5" fill="#FFFFFF"/></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><clipPath id="c10"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(482.0,96) scale(0.5)"><g clip-path="url(#c10)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="201" y="90" font-size="15" font-weight="600" fill="#40C8E0" text-anchor="middle">✓ Signed</text><linearGradient id="c11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8FC9"/><stop offset="0.55" stop-color="#C9D8E6"/><stop offset="0.75" stop-color="#F1D9A8"/></linearGradient><clipPath id="c12"><rect x="0" y="106" width="402" height="536"/></clipPath><g clip-path="url(#c12)"><rect x="0" y="106" width="402" height="536" rx="0" fill="url(#c11)"/><circle cx="289.44" cy="298.96" r="24.119999999999997" fill="#FFF3C4"/><path d="M0 491.91999999999996 L100.5 384.72 L180.9 470.48 L281.4 363.28 L402 481.2 L402 642 L0 642 Z" fill="#4C6B57"/><path d="M0 556.24 L140.7 481.2 L261.3 545.52 L402 502.64 L402 642 L0 642 Z" fill="#2E4637"/></g><text x="201" y="672" font-size="13" font-weight="600" fill="#B0B0B0" text-anchor="middle">1 of 3 · RAW + HEIF · 12 MP</text><circle cx="58" cy="794" r="26" fill="#333333"/><line x1="49" y1="785" x2="67" y2="803" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><line x1="67" y1="785" x2="49" y2="803" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><rect x="292" y="754.0" width="78" height="36" rx="18" fill="#333333"/><text x="331.0" y="777.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Share…</text><rect x="160" y="754.0" width="124" height="36" rx="18" fill="#333333"/><text x="222.0" y="777.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Photo Details</text><rect x="234" y="798.0" width="136" height="36" rx="18" fill="#333333"/><text x="302.0" y="821.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open in Photos</text><rect x="134" y="858" width="134" height="5" rx="2.5" fill="#FFFFFF"/></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><line x1="13.0" y1="493.0" x2="75.0" y2="493.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><line x1="53.0" y1="446.0" x2="53.0" y2="539.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><line x1="242.0" y1="493.0" x2="304.0" y2="493.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><line x1="282.0" y1="446.0" x2="282.0" y2="539.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><line x1="471.0" y1="493.0" x2="533.0" y2="493.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><line x1="511.0" y1="446.0" x2="511.0" y2="539.0" stroke="#FF453A" stroke-width="1" stroke-dasharray="6 4"/><text x="24" y="557.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. Camera</text><text x="24" y="575.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Last Photo, 52 pt, placed by the</text><text x="24" y="590.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">camera's shutter row.</text><text x="253.0" y="557.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. Viewer</text><text x="253.0" y="575.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Close has the same frame as Last</text><text x="253.0" y="590.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Photo, to the point, on every size</text><text x="253.0" y="606.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">and layout.</text><text x="482.0" y="557.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">C. Viewer with Share… (issue 132)</text><text x="482.0" y="575.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Three actions wrap into two lines,</text><text x="482.0" y="590.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">centered on Close. Close does not</text><text x="482.0" y="606.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">move.</text><text x="711.0" y="112" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">The rule</text><text x="711.0" y="132.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The viewer's bottom row takes its height and</text><text x="711.0" y="147.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">its top padding from the same layout function</text><text x="711.0" y="163.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">as the camera's shutter row, and Close is</text><text x="711.0" y="178.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">placed by the rule that places Last Photo.</text><text x="711.0" y="194.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Today the viewer gives its row an 88 pt</text><text x="711.0" y="209.625" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">minimum and no share of the spare height, so</text><text x="711.0" y="225.15" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Close sits 3 to 13.5 pt lower and 33 to 49 pt</text><text x="711.0" y="240.675" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">to the side.</text><text x="711.0" y="270.2" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">The test</text><text x="711.0" y="290.2" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">A UI test reads the frame of Last Photo, opens</text><text x="711.0" y="305.72499999999997" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">the viewer, and reads the frame of Close:</text><text x="711.0" y="321.25" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">equal within 0.5 pt on a 402 × 874 and a 440 ×</text><text x="711.0" y="336.775" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">956 iPhone, sideways, on iPad (the column</text><text x="711.0" y="352.3" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">layout) and on the iPhone Duo's two displays.</text><text x="711.0" y="367.825" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">At accessibility text sizes both are</text><text x="711.0" y="383.35" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">full-width rows and the test does not apply.</text></svg>
