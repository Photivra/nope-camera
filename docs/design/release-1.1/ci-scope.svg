<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Which CI jobs a change runs</title><desc id="d">A diagram: changed paths go to a scope job, which chooses a full run or a light run; the jobs of each; and the fail-safe rules.</desc><rect width="980" height="610" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >CI: which jobs a change runs (issue 85)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >One scope job classifies the changed paths. The required check names do not change; each reports in its summary why it ran or did not.</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8e8e93"/></marker></defs><rect x="24" y="80" width="250" height="130" rx="12" fill="#1c1c1e" /><text x="38" y="104" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Changed paths</text><text x="38" y="124" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >git diff, base to head, by name</text><text x="38" y="140" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >(both names of a renamed file)</text><text x="38" y="156" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="38" y="172" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >No base, an empty diff or an error:</text><text x="38" y="188" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >full run</text><rect x="330" y="80" width="280" height="130" rx="12" fill="#1c1c1e" stroke="#40c8e0" stroke-width="1.5" /><text x="344" y="104" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >scope job (ubuntu, seconds)</text><text x="344" y="124" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >scripts/ci-scope.sh</text><text x="344" y="140" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >rules: scripts/ci-scope-rules.txt</text><text x="344" y="156" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >outputs: app = true | false</text><text x="344" y="172" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >summary: each path and its group</text><path d="M274 145L328 145" stroke="#8e8e93" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="24" y="250" width="290" height="150" rx="12" fill="#1c1c1e" stroke="#ff9f0a" stroke-width="1.5" /><text x="38" y="274" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Full run (app = true)</text><text x="38" y="294" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >app code, tests, Package.swift, Config,</text><text x="38" y="310" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >string catalogs, assets, docs/api, .docc</text><text x="38" y="326" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >CI and scripts: .github/, scripts/</text><text x="38" y="342" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >a path in no group</text><text x="38" y="358" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >push to main · release pull request</text><text x="38" y="374" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >the label ci:full</text><rect x="346" y="250" width="290" height="150" rx="12" fill="#1c1c1e" stroke="#40c8e0" stroke-width="1.5" /><text x="360" y="274" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Light run (app = false)</text><text x="360" y="294" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >docs only: docs/ (not docs/api), *.md,</text><text x="360" y="310" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >docs/design/, llms.txt</text><text x="360" y="326" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >store metadata: store/</text><text x="360" y="342" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >site: site/</text><text x="360" y="358" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >and nothing from the full-run list</text><path d="M420 210L200 248" stroke="#8e8e93" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M500 210L500 248" stroke="#8e8e93" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="24" y="440" width="290" height="150" rx="12" fill="#1c1c1e" /><text x="38" y="464" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Jobs</text><text x="38" y="484" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >repo-checks</text><text x="38" y="500" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >c2pa-lib, unit-tests, ui-build, every UI</text><text x="38" y="516" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >shard, watch, oldest-os, file-compat, docs</text><text x="38" y="532" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="38" y="548" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >required names report the real result</text><rect x="346" y="440" width="290" height="150" rx="12" fill="#1c1c1e" /><text x="360" y="464" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Jobs</text><text x="360" y="484" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >repo-checks (unchanged, always whole)</text><text x="360" y="500" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >unit-tests, ui-tests, ui-tests-ipad,</text><text x="360" y="516" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >ui-tests-watch, docs: pass at once, with</text><text x="360" y="532" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >&quot;not needed for this change&quot; and the</text><text x="360" y="548" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >paths in the summary</text><path d="M169 400L169 438" stroke="#8e8e93" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M491 400L491 438" stroke="#8e8e93" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="668" y="80" width="288" height="510" rx="12" fill="#1c1c1e" /><text x="682" y="104" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start" >Fail safe</text><text x="682" y="124" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >The scope job fails or is cancelled:</text><text x="682" y="140" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >every job runs.</text><text x="682" y="156" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="682" y="172" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >A required job&#x27;s work fails or is</text><text x="682" y="188" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >cancelled: the required name fails.</text><text x="682" y="204" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="682" y="220" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >A change touches both lists: full run.</text><text x="682" y="236" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="682" y="252" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >A release is never merged on a light</text><text x="682" y="268" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >run: the release pull request and the</text><text x="682" y="284" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >push to main always run everything.</text><text x="682" y="300" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" ></text><text x="682" y="316" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >Path names are data: read with -z,</text><text x="682" y="332" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >never evaluated, shown in a code</text><text x="682" y="348" font-size="11.5" font-weight="400" fill="#d1d1d6" text-anchor="start" >block, at most 200 in the summary.</text></svg>
