<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">The Shutter Sound row in Settings</title><desc id="d">Three Settings pages: Shutter Sound off, on, and shown as Always On where iOS does not allow the sound to be suppressed.</desc><rect width="980" height="510" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start" >Shutter Sound (issue 128)</text><text x="24" y="54" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start" >Settings › Camera. Off by default (decided). Draft wording until the device check and the Honesty review.</text><rect x="24" y="72" width="300" height="420" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="174.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Settings</text><text x="56" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >CAMERA</text><rect x="40" y="146" width="268" height="184" rx="12" fill="#1c1c1e" /><text x="56" y="174.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Fast Shutter</text><text x="278" y="174.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Standard</text><text x="292" y="174.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="56" y="191.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="220.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Face Detection</text><rect x="244" y="201.0" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="278" cy="215.0" r="12" fill="#fff" /><rect x="56" y="237.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="56" y="260" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Shutter Sound</text><text x="56" y="278" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >Off: nope. asks iOS to take photos</text><text x="56" y="293" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >silently. iOS still plays the sound</text><text x="56" y="308" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >where it is required.</text><rect x="244" y="246" width="48" height="28" rx="14" fill="#39393d" opacity="1"/><circle cx="258" cy="260" r="12" fill="#fff" /><text x="40" y="352" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >A. Off (default)</text><rect x="340" y="72" width="300" height="420" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="490.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Settings</text><text x="372" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >CAMERA</text><rect x="356" y="146" width="268" height="184" rx="12" fill="#1c1c1e" /><text x="372" y="174.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Fast Shutter</text><text x="594" y="174.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Standard</text><text x="608" y="174.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="372" y="191.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="220.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Face Detection</text><rect x="560" y="201.0" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="594" cy="215.0" r="12" fill="#fff" /><rect x="372" y="237.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="372" y="260" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Shutter Sound</text><text x="372" y="278" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >On: iOS plays its shutter sound for</text><text x="372" y="293" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >each photo. It follows the iPhone&#x27;s</text><text x="372" y="308" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >ringer and volume.</text><rect x="560" y="246" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="594" cy="260" r="12" fill="#fff" /><text x="356" y="352" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >B. On</text><rect x="656" y="72" width="300" height="420" rx="28" fill="#000" stroke="#2c2c2e" stroke-width="1" /><text x="806.0" y="110" font-size="15" font-weight="600" fill="#f2f2f7" text-anchor="middle" >Settings</text><text x="688" y="138" font-size="11" font-weight="500" fill="#8e8e93" text-anchor="start" >CAMERA</text><rect x="672" y="146" width="268" height="184" rx="12" fill="#1c1c1e" /><text x="688" y="174.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Fast Shutter</text><text x="910" y="174.0" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Standard</text><text x="924" y="174.0" font-size="16" font-weight="400" fill="#636366" text-anchor="end" >›</text><rect x="688" y="191.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="220.0" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Face Detection</text><rect x="876" y="201.0" width="48" height="28" rx="14" fill="#40c8e0" opacity="1"/><circle cx="910" cy="215.0" r="12" fill="#fff" /><rect x="688" y="237.5" width="252" height="0.5" rx="0" fill="#38383a" /><text x="688" y="260" font-size="14.5" font-weight="400" fill="#f2f2f7" text-anchor="start" >Shutter Sound</text><text x="688" y="278" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >On this iPhone, iOS always plays the</text><text x="688" y="293" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >shutter sound. nope. can&#x27;t turn it</text><text x="688" y="308" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start" >off.</text><text x="924" y="260" font-size="14" font-weight="400" fill="#aeaeb2" text-anchor="end" >Always On</text><text x="672" y="352" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >C. Where iOS does not allow silence:</text><text x="672" y="369" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start" >a value, not a switch</text></svg>
