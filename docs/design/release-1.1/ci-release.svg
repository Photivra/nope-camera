<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">CI in 1.1: retries, on-demand UI tests, TestFlight uploads and the store page</title><desc id="d">A diagram in three bands. Pull requests and pushes run the build workflow with no secrets, and a failed UI test retries once and is recorded as flaky. On-demand UI tests run by manual dispatch with no secrets. The TestFlight and store page workflows run by manual dispatch only, in a protected environment that holds the App Store Connect API key and needs the maintainer's approval.</desc><rect width="1100" height="700" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">CI in 1.1: retries, on-demand tests, TestFlight and the store page (issues 159 to 162)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Three bands by what a run may touch. Only the bottom band can read the App Store Connect API key, and nothing in it runs on a pull request.</text><rect x="24" y="84" width="1052" height="170" rx="14" fill="#0f1a14" stroke="#2c2c2e" stroke-width="1"/><text x="38" y="106" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">1. Pull requests and pushes · no secrets</text><rect x="24" y="270" width="1052" height="150" rx="14" fill="#10161f" stroke="#2c2c2e" stroke-width="1"/><text x="38" y="292" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">2. Manual dispatch · no secrets</text><rect x="24" y="436" width="1052" height="240" rx="14" fill="#1f1410" stroke="#2c2c2e" stroke-width="1"/><text x="38" y="458" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">3. Manual dispatch only · environment "app-store" · the maintainer approves each run</text><rect x="44" y="120" width="230" height="118" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="56" y="142" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">build.yml (as today, with #85)</text><text x="56" y="160" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Unit tests: never retried.</text><text x="56" y="175" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">UI shards: each test runs once.</text><rect x="314" y="120" width="250" height="118" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="326" y="142" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">A UI test fails (#159)</text><text x="326" y="160" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">It runs once more in the same job.</text><text x="326" y="175" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Passes: the job passes; the test is</text><text x="326" y="190" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">recorded as "flaky" in the per-test</text><text x="326" y="205" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">results. Fails again: the job fails.</text><rect x="604" y="120" width="220" height="118" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="616" y="142" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Per-test results</text><text x="616" y="160" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">test-results-*.jsonl, one line per</text><text x="616" y="175" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">attempt: passed, failed, flaky,</text><text x="616" y="190" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">interrupted.</text><rect x="864" y="120" width="196" height="118" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="876" y="142" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">flaky-tests.sh</text><text x="876" y="160" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">A test that needed a retry</text><text x="876" y="175" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">in two runs gets an issue,</text><text x="876" y="190" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">opened by a maintainer</text><text x="876" y="205" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">or agent, not by CI.</text><line x1="274" y1="180" x2="312" y2="180" stroke="#8e8e93" stroke-width="1.5"/><line x1="312" y1="180" x2="305.1448899730484" y2="184.12401097457172" stroke="#8e8e93" stroke-width="1.5"/><line x1="312" y1="180" x2="305.1448899730484" y2="175.87598902542828" stroke="#8e8e93" stroke-width="1.5"/><line x1="564" y1="180" x2="602" y2="180" stroke="#8e8e93" stroke-width="1.5"/><line x1="602" y1="180" x2="595.1448899730484" y2="184.12401097457172" stroke="#8e8e93" stroke-width="1.5"/><line x1="602" y1="180" x2="595.1448899730484" y2="175.87598902542828" stroke="#8e8e93" stroke-width="1.5"/><line x1="824" y1="180" x2="862" y2="180" stroke="#8e8e93" stroke-width="1.5"/><line x1="862" y1="180" x2="855.1448899730484" y2="184.12401097457172" stroke="#8e8e93" stroke-width="1.5"/><line x1="862" y1="180" x2="855.1448899730484" y2="175.87598902542828" stroke="#8e8e93" stroke-width="1.5"/><rect x="44" y="304" width="300" height="100" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="56" y="326" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">ui-tests-on-demand.yml (#162)</text><text x="56" y="344" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Inputs: branch, test identifiers, devices</text><text x="56" y="359" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">(iPhone, iPad, watch; OS), repeat count.</text><text x="56" y="374" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Inputs are checked against a pattern.</text><rect x="384" y="304" width="300" height="100" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="396" y="326" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">The same scripts as build.yml</text><text x="396" y="344" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">run-ui-test-shard.sh with -only-testing.</text><text x="396" y="359" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">No retry here: every attempt is reported,</text><text x="396" y="374" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">so a flake shows as a count.</text><rect x="724" y="304" width="336" height="100" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="736" y="326" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Artifacts</text><text x="736" y="344" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Per-test results and the result bundle.</text><text x="736" y="359" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Not a required check, and not the release</text><text x="736" y="374" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">proof: the release run is still the full one.</text><line x1="344" y1="354" x2="382" y2="354" stroke="#8e8e93" stroke-width="1.5"/><line x1="382" y1="354" x2="375.1448899730484" y2="358.1240109745717" stroke="#8e8e93" stroke-width="1.5"/><line x1="382" y1="354" x2="375.1448899730484" y2="349.8759890254283" stroke="#8e8e93" stroke-width="1.5"/><line x1="684" y1="354" x2="722" y2="354" stroke="#8e8e93" stroke-width="1.5"/><line x1="722" y1="354" x2="715.1448899730484" y2="358.1240109745717" stroke="#8e8e93" stroke-width="1.5"/><line x1="722" y1="354" x2="715.1448899730484" y2="349.8759890254283" stroke="#8e8e93" stroke-width="1.5"/><rect x="44" y="470" width="240" height="110" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="56" y="492" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">testflight.yml: archive (#160)</text><text x="56" y="510" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Checks out the chosen branch or tag.</text><text x="56" y="525" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Builds and archives, unsigned.</text><text x="56" y="540" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Runs the plist, launch-screen and</text><text x="56" y="555" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">App Store ID checks. No secrets.</text><rect x="324" y="470" width="260" height="110" rx="10" fill="#2a1a12" stroke="#FF9F0A" stroke-width="1"/><text x="336" y="492" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">testflight.yml: upload</text><text x="336" y="510" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Waits for approval. Checks out main</text><text x="336" y="525" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">only. Signs and exports the archive</text><text x="336" y="540" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">with the API key, uploads it to</text><text x="336" y="555" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">TestFlight, deletes the key file.</text><rect x="624" y="470" width="200" height="110" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="636" y="492" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">App Store Connect</text><text x="636" y="510" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">An internal TestFlight build.</text><text x="636" y="525" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Nothing reaches testers or</text><text x="636" y="540" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">the store without the</text><text x="636" y="555" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">maintainer, as today.</text><line x1="284" y1="525" x2="322" y2="525" stroke="#8e8e93" stroke-width="1.5"/><line x1="322" y1="525" x2="315.1448899730484" y2="529.1240109745717" stroke="#8e8e93" stroke-width="1.5"/><line x1="322" y1="525" x2="315.1448899730484" y2="520.8759890254283" stroke="#8e8e93" stroke-width="1.5"/><line x1="584" y1="525" x2="622" y2="525" stroke="#8e8e93" stroke-width="1.5"/><line x1="622" y1="525" x2="615.1448899730484" y2="529.1240109745717" stroke="#8e8e93" stroke-width="1.5"/><line x1="622" y1="525" x2="615.1448899730484" y2="520.8759890254283" stroke="#8e8e93" stroke-width="1.5"/><rect x="44" y="596" width="240" height="68" rx="10" fill="#2a1a12" stroke="#FF9F0A" stroke-width="1"/><text x="56" y="618" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">store-page.yml: compare (#161)</text><text x="56" y="636" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Dry run: prints the differences from</text><text x="56" y="651" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">App Store Connect. Changes nothing.</text><rect x="324" y="596" width="260" height="68" rx="10" fill="#2a1a12" stroke="#FF9F0A" stroke-width="1"/><text x="336" y="618" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">store-page.yml: publish</text><text x="336" y="636" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">Text and screenshots from store/, to</text><text x="336" y="651" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">the version being prepared.</text><rect x="624" y="596" width="436" height="68" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="636" y="618" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">Stays by hand</text><text x="636" y="636" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">App Privacy, age rating, pricing, release notes approval, submission</text><text x="636" y="651" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">for review, and the release itself (AGENTS.md, rule 5).</text><line x1="284" y1="630" x2="322" y2="630" stroke="#8e8e93" stroke-width="1.5"/><line x1="322" y1="630" x2="315.1448899730484" y2="634.1240109745717" stroke="#8e8e93" stroke-width="1.5"/><line x1="322" y1="630" x2="315.1448899730484" y2="625.8759890254283" stroke="#8e8e93" stroke-width="1.5"/><rect x="864" y="470" width="196" height="110" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/><text x="876" y="492" font-size="12.5" font-weight="600" fill="#f2f2f7" text-anchor="start">The key</text><text x="876" y="510" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">An environment secret, not a</text><text x="876" y="525" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">repository secret. Only jobs</text><text x="876" y="540" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">outlined in amber can read</text><text x="876" y="555" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">it. Never on a pull request.</text></svg>
