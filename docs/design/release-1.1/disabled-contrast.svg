<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">Disabled controls: three options for their contrast</title><desc id="d">The same three disabled controls drawn three ways, in normal colors and in Night Mode, with the calculated contrast of each: today's 40 percent opacity, a 3 to 1 floor, and 4.5 to 1.</desc><rect width="1000" height="560" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">Disabled controls: how readable should "unavailable" be? (issue 142)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Three disabled controls: a lens with its "No RAW" caption, a capsule button, and a Q tile. Each option is drawn in normal colors and in Night Mode.</text><text x="24" y="72" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Ratios are calculated against what is directly behind the text. WCAG 2.2 exempts inactive controls; the question is whether this app should (decision 51).</text><text x="24.0" y="112" font-size="13" font-weight="600" fill="#f2f2f7" text-anchor="start">(a) Recommended: a 3:1 floor</text><text x="24.0" y="130.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Disabled text and symbols are one color that keeps</text><text x="24.0" y="145.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">at least 3:1 on what is behind it. With Increase</text><text x="24.0" y="161.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Contrast, 4.5:1 outside Night Mode.</text><rect x="24.0" y="196" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="36.0" y="216" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="start">Normal</text><rect x="38.0" y="232" width="64" height="44" rx="22" fill="#141414"/><text x="70.0" y="259" font-size="15" font-weight="600" fill="#6B6B6B" text-anchor="middle">5</text><text x="70.0" y="294" font-size="11" font-weight="600" fill="#6B6B6B" text-anchor="middle">No RAW</text><rect x="120.0" y="236" width="84" height="36" rx="18" fill="#141414"/><text x="162.0" y="259" font-size="14" font-weight="600" fill="#6B6B6B" text-anchor="middle">Reset</text><rect x="220.0" y="226" width="96" height="56" rx="12" fill="#141414"/><text x="230.0" y="248" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start">Flash</text><text x="230.0" y="269" font-size="15" font-weight="600" fill="#6B6B6B" text-anchor="start">Off</text><text x="38.0" y="320" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 3.46:1 on its fill, 3.94:1 on black</text><text x="38.0" y="336" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 3.94:1 on black</text><rect x="24.0" y="366" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="36.0" y="386" font-size="11" font-weight="600" fill="#B3201A" text-anchor="start">Night Mode</text><rect x="38.0" y="402" width="64" height="44" rx="22" fill="#080000"/><text x="70.0" y="429" font-size="15" font-weight="600" fill="#C80000" text-anchor="middle">5</text><text x="70.0" y="464" font-size="11" font-weight="600" fill="#C80000" text-anchor="middle">No RAW</text><rect x="120.0" y="406" width="84" height="36" rx="18" fill="#080000"/><text x="162.0" y="429" font-size="14" font-weight="600" fill="#C80000" text-anchor="middle">Reset</text><rect x="220.0" y="396" width="96" height="56" rx="12" fill="#080000"/><text x="230.0" y="418" font-size="12" font-weight="500" fill="#C80000" text-anchor="start">Flash</text><text x="230.0" y="439" font-size="15" font-weight="600" fill="#C80000" text-anchor="start">Off</text><text x="38.0" y="490" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 3.42:1 on its fill, 3.46:1 on black</text><text x="38.0" y="506" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 3.46:1 on black</text><text x="348.0" y="112" font-size="13" font-weight="600" fill="#f2f2f7" text-anchor="start">(b) No exemption: 4.5:1 text, 3:1 symbols</text><text x="348.0" y="130.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Disabled text meets the same minimum as any text.</text><text x="348.0" y="145.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">In Night Mode this is nearly full red, so disabled</text><text x="348.0" y="161.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">needs another sign there.</text><rect x="348.0" y="196" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="360.0" y="216" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="start">Normal</text><rect x="362.0" y="232" width="64" height="44" rx="22" fill="#141414"/><text x="394.0" y="259" font-size="15" font-weight="600" fill="#7A7A7A" text-anchor="middle">5</text><text x="394.0" y="294" font-size="11" font-weight="600" fill="#7A7A7A" text-anchor="middle">No RAW</text><rect x="444.0" y="236" width="84" height="36" rx="18" fill="#141414"/><text x="486.0" y="259" font-size="14" font-weight="600" fill="#7A7A7A" text-anchor="middle">Reset</text><rect x="544.0" y="226" width="96" height="56" rx="12" fill="#141414"/><text x="554.0" y="248" font-size="12" font-weight="500" fill="#7A7A7A" text-anchor="start">Flash</text><text x="554.0" y="269" font-size="15" font-weight="600" fill="#7A7A7A" text-anchor="start">Off</text><text x="362.0" y="320" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 4.29:1 on its fill, 4.89:1 on black</text><text x="362.0" y="336" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 4.89:1 on black</text><rect x="348.0" y="366" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="360.0" y="386" font-size="11" font-weight="600" fill="#B3201A" text-anchor="start">Night Mode</text><rect x="362.0" y="402" width="64" height="44" rx="22" fill="#080000"/><text x="394.0" y="429" font-size="15" font-weight="600" fill="#F00000" text-anchor="middle">5</text><text x="394.0" y="464" font-size="11" font-weight="600" fill="#F00000" text-anchor="middle">No RAW</text><rect x="444.0" y="406" width="84" height="36" rx="18" fill="#080000"/><text x="486.0" y="429" font-size="14" font-weight="600" fill="#F00000" text-anchor="middle">Reset</text><rect x="544.0" y="396" width="96" height="56" rx="12" fill="#080000"/><text x="554.0" y="418" font-size="12" font-weight="500" fill="#F00000" text-anchor="start">Flash</text><text x="554.0" y="439" font-size="15" font-weight="600" fill="#F00000" text-anchor="start">Off</text><text x="362.0" y="490" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 4.66:1 on its fill, 4.71:1 on black</text><text x="362.0" y="506" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 4.71:1 on black</text><text x="672.0" y="112" font-size="13" font-weight="600" fill="#f2f2f7" text-anchor="start">(c) Today: 40% opacity, exempt</text><text x="672.0" y="130.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The whole control is drawn at 40%. Secondary text</text><text x="672.0" y="145.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">falls to about 2:1, and Night Mode to 1.5:1.</text><rect x="672.0" y="196" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="684.0" y="216" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="start">Normal</text><rect x="686.0" y="232" width="64" height="44" rx="22" fill="#141414"/><text x="718.0" y="259" font-size="15" font-weight="600" fill="#666666" text-anchor="middle">5</text><text x="718.0" y="294" font-size="11" font-weight="600" fill="#464647" text-anchor="middle">No RAW</text><rect x="768.0" y="236" width="84" height="36" rx="18" fill="#141414"/><text x="810.0" y="259" font-size="14" font-weight="600" fill="#666666" text-anchor="middle">Reset</text><rect x="868.0" y="226" width="96" height="56" rx="12" fill="#141414"/><text x="878.0" y="248" font-size="12" font-weight="500" fill="#464647" text-anchor="start">Flash</text><text x="878.0" y="269" font-size="15" font-weight="600" fill="#666666" text-anchor="start">Off</text><text x="686.0" y="320" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 3.21:1 on its fill, 3.66:1 on black</text><text x="686.0" y="336" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 2.23:1 on black</text><rect x="672.0" y="366" width="304.0" height="150" rx="14" fill="#000000" stroke="#2c2c2e" stroke-width="1"/><text x="684.0" y="386" font-size="11" font-weight="600" fill="#B3201A" text-anchor="start">Night Mode</text><rect x="686.0" y="402" width="64" height="44" rx="22" fill="#080000"/><text x="718.0" y="429" font-size="15" font-weight="600" fill="#660000" text-anchor="middle">5</text><text x="718.0" y="464" font-size="11" font-weight="600" fill="#660000" text-anchor="middle">No RAW</text><rect x="768.0" y="406" width="84" height="36" rx="18" fill="#080000"/><text x="810.0" y="429" font-size="14" font-weight="600" fill="#660000" text-anchor="middle">Reset</text><rect x="868.0" y="396" width="96" height="56" rx="12" fill="#080000"/><text x="878.0" y="418" font-size="12" font-weight="500" fill="#660000" text-anchor="start">Flash</text><text x="878.0" y="439" font-size="15" font-weight="600" fill="#660000" text-anchor="start">Off</text><text x="686.0" y="490" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">label 1.55:1 on its fill, 1.56:1 on black</text><text x="686.0" y="506" font-size="11" font-weight="400" fill="#aeaeb2" text-anchor="start">caption 1.56:1 on black</text></svg>
