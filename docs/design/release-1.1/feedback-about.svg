<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 957.0 683.0" width="957.0" height="683.0" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif"><title id="t">About: Send Feedback and Report a Problem on GitHub</title><desc id="d">Three screens: the About screen with the new Feedback section, the Mail draft that Send Feedback opens, and the About screen when Mail did not open.</desc><rect width="957.0" height="683.0" fill="#101012"/><text x="24" y="34" font-size="17" font-weight="600" fill="#f2f2f7" text-anchor="start">About: Send Feedback, and Report a Problem on GitHub (issue 144)</text><text x="24" y="56" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Two rows in a new Feedback section, between Source Code and App Store. Both leave the app, and each says so. The app sends nothing itself.</text><text x="24" y="72" font-size="12" font-weight="400" fill="#aeaeb2" text-anchor="start">Draft wording, the same as the support page. The About screen uses the full name, Photivra Nope Camera.</text><clipPath id="c1"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(24,96) scale(0.5)"><g clip-path="url(#c1)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="20" y="92" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">‹ Settings</text><text x="201" y="92" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">About</text><text x="36" y="132" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">SOURCE CODE</text><rect x="16" y="142" width="370" height="52" rx="22" fill="#1C1C1C"/><text x="36" y="174" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">github.com/Photivra/nope-camera</text><text x="36" y="236" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">FEEDBACK</text><rect x="16" y="246" width="370" height="52" rx="22" fill="#1C1C1C"/><text x="36" y="278" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">Send Feedback</text><text x="36" y="320" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">Opens Mail with a message to hello@photivra.com.</text><text x="36" y="338" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">It starts with the app's version and your iOS</text><text x="36" y="356" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">version; you can edit or delete them. Photivra</text><text x="36" y="374" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">Nope Camera sends nothing itself.</text><rect x="16" y="398" width="370" height="52" rx="22" fill="#1C1C1C"/><text x="36" y="430" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">Report a Problem on GitHub</text><text x="36" y="472" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">Opens in your browser. Issues are public and need</text><text x="36" y="490" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">a free GitHub account. Don't include personal</text><text x="36" y="508" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">information, and attach a photo only if you're</text><text x="36" y="526" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">willing to make it public: a photo can carry its</text><text x="36" y="544" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">location and other details.</text><text x="36" y="588" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">APP STORE</text><rect x="16" y="598" width="370" height="52" rx="22" fill="#1C1C1C"/><text x="36" y="630" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">Rate or Review</text></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><text x="24" y="555.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">A. About, with Feedback</text><text x="24" y="573.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Rate or Review stays as it is.</text><text x="24" y="588.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">VoiceOver reads each row as a link,</text><text x="24" y="604.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">with the hint "Opens Mail." or</text><text x="24" y="619.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">"Opens in your browser."</text><clipPath id="c2"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(253.0,96) scale(0.5)"><g clip-path="url(#c2)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#1C1C1E"/><text x="20" y="92" font-size="17" font-weight="400" fill="#0A84FF" text-anchor="start">Cancel</text><text x="201" y="92" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">New Message</text><text x="20" y="162" font-size="16" font-weight="400" fill="#8E8E93" text-anchor="start">To:</text><text x="56" y="162" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">hello@photivra.com</text><rect x="20" y="178" width="382" height="0.7" rx="0" fill="#38383A"/><text x="20" y="210" font-size="16" font-weight="400" fill="#8E8E93" text-anchor="start">Subject:</text><text x="94" y="210" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Photivra Nope Camera feedback</text><rect x="20" y="226" width="382" height="0.7" rx="0" fill="#38383A"/><rect x="18" y="262" width="2" height="20" rx="0" fill="#0A84FF"/><text x="20" y="330" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Photivra Nope Camera 1.1.0 (57)</text><text x="20" y="354" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">iOS 27.2</text><rect x="12" y="310" width="300" height="56" rx="8" fill="none" stroke="#FF9F0A" stroke-width="1.5" stroke-dasharray="5 4"/></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><text x="253.0" y="555.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">B. The draft, in Mail</text><text x="253.0" y="573.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The system's screen, not the app's.</text><text x="253.0" y="588.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The dashed lines are the only text</text><text x="253.0" y="604.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">the app adds: its version and build,</text><text x="253.0" y="619.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">and the iOS version. The person can</text><text x="253.0" y="635.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">change or delete them, and decides</text><text x="253.0" y="650.625" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">whether to send.</text><clipPath id="c3"><rect x="0" y="0" width="402" height="874" rx="52"/></clipPath><g transform="translate(482.0,96) scale(0.5)"><g clip-path="url(#c3)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#000000"/><text x="20" y="92" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">‹ Settings</text><text x="201" y="92" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">About</text><text x="36" y="132" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">FEEDBACK</text><rect x="16" y="142" width="370" height="104" rx="22" fill="#1C1C1C"/><text x="36" y="174" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">Send Feedback</text><text x="36" y="226" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">hello@photivra.com</text><rect x="36" y="194" width="350" height="0.7" rx="0" fill="#4E4E4E"/><text x="36" y="268" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">Mail didn't open. You can write to this address</text><text x="36" y="286" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">from any mail app. Touch and hold the address to</text><text x="36" y="304" font-size="13" font-weight="400" fill="#B0B0B0" text-anchor="start">copy it.</text><rect x="16" y="328" width="370" height="52" rx="22" fill="#1C1C1C"/><text x="36" y="360" font-size="17" font-weight="400" fill="#40C8E0" text-anchor="start">Report a Problem on GitHub</text></g><rect x="1" y="1" width="400" height="872" rx="52" fill="none" stroke="#3a3a3c" stroke-width="2"/></g><text x="482.0" y="555.0" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">C. When Mail does not open</text><text x="482.0" y="573.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">If iOS reports that the mail link</text><text x="482.0" y="588.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">did not open, the address appears as</text><text x="482.0" y="604.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">selectable text with one sentence.</text><text x="482.0" y="619.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">The app uses no clipboard code:</text><text x="482.0" y="635.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">copying is the system's own text</text><text x="482.0" y="650.625" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">selection.</text><text x="711.0" y="112" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">What the app does</text><text x="711.0" y="132.0" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Send Feedback opens one mailto: link</text><text x="711.0" y="147.525" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">when the person taps it. The link</text><text x="711.0" y="163.05" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">carries the address, the subject and</text><text x="711.0" y="178.575" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">the two lines of the draft. Nothing is</text><text x="711.0" y="194.1" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">sent by the app, no network code is</text><text x="711.0" y="209.625" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">added, and no device model,</text><text x="711.0" y="225.15" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">identifier, photo, setting or log goes</text><text x="711.0" y="240.675" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">into the draft.</text><text x="711.0" y="274.2" font-size="12.5" font-weight="600" fill="#d1d1d6" text-anchor="start">What it does not do</text><text x="711.0" y="294.2" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">No in-app mail form, no attachment, no</text><text x="711.0" y="309.72499999999997" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">diagnostics file, no check for a mail</text><text x="711.0" y="325.25" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">account before the tap. Report a</text><text x="711.0" y="340.775" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">Problem on GitHub is a plain https</text><text x="711.0" y="356.3" font-size="11.5" font-weight="400" fill="#aeaeb2" text-anchor="start">link, like Source Code.</text></svg>
