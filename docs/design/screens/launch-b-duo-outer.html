<style>
html{background:#101012}body{margin:0;color:#f2f2f7;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}.stage{padding:24px;display:inline-block}.note{max-width:640px;padding:0 24px 32px;color:#aeaeb2;font-size:14px}.note b{color:#f2f2f7;display:block;font-size:17px;margin-bottom:4px}.note a{color:inherit}

.dev{position:relative;overflow:hidden;background:#000;color:#fff;font:600 15px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;

.form{background:#000;color:#fff;font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;--fbg:#000;--cell:#1c1c1e;--fsec:#98989f;--sep:rgba(84,84,88,.6);--tint:#fff;--on:#34c759;--fact:#40c8e0;--warn:#ff9f0a;--stop:#ff453a}

.form.nightf{background:#000;color:#f00;--cell:#0c0000;--fsec:#f00;--sep:#b3201a;--tint:#f00;--on:#f00;--fact:#f00;--warn:#f00;--stop:#f00}
.form .nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;font-weight:600}
