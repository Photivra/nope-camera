name: build

# Builds and tests the app on GitHub-hosted macOS runners (AGENTS.md, "Keep the repository
# clean"). The job names are stable so they can be required status checks.
#
# Runner: the `xcode-27` image (macOS with Xcode 27), with Xcode 27.2 selected explicitly so CI
# matches the local toolchain. See docs/TESTING.md, "Continuous integration".

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  SIMULATOR: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2
  IPAD_SIMULATOR: platform=iOS Simulator,name=iPad Air 11-inch (M4),OS=27.2

jobs:
  unit-tests:
    name: unit-tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test the coverage gate
        run: scripts/test-check-coverage.sh
      - name: Test the tag dumper's TIFF walker
        run: scripts/test-dump-tags.sh
      - name: Build and test NopeKit
        run: >
          xcodebuild test
          -scheme NopeKit-Package
          -destination "$SIMULATOR"
          -derivedDataPath DerivedData
          -resultBundlePath unit-tests.xcresult
          -enableCodeCoverage YES
          CODE_SIGNING_ALLOWED=NO
      - name: Coverage gate (100% lines and branches of logic modules)
        run: scripts/check-coverage.sh DerivedData
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-xcresult
          path: unit-tests.xcresult
          retention-days: 7

  ui-tests:
    name: ui-tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app and run the UI tests with accessibility audits on iPhone
        run: >
          xcodebuild test
          -project App/NopeCamera.xcodeproj
          -scheme NopeApp
          -destination "$SIMULATOR"
          -derivedDataPath DerivedData
          -resultBundlePath ui-tests.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-xcresult
          path: ui-tests.xcresult
          retention-days: 7

  # The same UI tests on an iPad, in their own job: running both Simulators in one job stalled
  # the test runner before the second destination's first test.
  ui-tests-ipad:
    name: ui-tests-ipad
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app and run the UI tests with accessibility audits on iPad
        run: >
          xcodebuild test
          -project App/NopeCamera.xcodeproj
          -scheme NopeApp
          -destination "$IPAD_SIMULATOR"
          -derivedDataPath DerivedData
          -resultBundlePath ui-tests-ipad.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-ipad-xcresult
          path: ui-tests-ipad.xcresult
          retention-days: 7

  docs:
    name: docs
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DocC build (warnings as errors), documentation coverage and docs/api check
        run: scripts/check-docs.sh DerivedData
