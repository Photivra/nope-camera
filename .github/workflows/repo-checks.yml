name: repo checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-repo.sh
      - name: Test the security checks
        run: scripts/test-check-security.sh
      - name: Security checks
        run: scripts/check-security.sh
      - name: Test the architecture checks
        run: scripts/test-check-architecture.sh
      - name: Architecture checks
        run: scripts/check-architecture.sh
