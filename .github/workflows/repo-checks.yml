name: repo checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-repo.sh
      - name: Test the security checks
        run: scripts/test-check-security.sh
      - name: Security checks
        run: scripts/check-security.sh
      - name: Test the architecture checks
        run: scripts/test-check-architecture.sh
      - name: Architecture checks
        run: scripts/check-architecture.sh
      - name: Test the file compatibility check
        run: scripts/test-check-file-compat.sh
      - name: Test the localization checks
        run: scripts/test-check-localization.sh
      - name: Localization checks
        run: scripts/check-localization.sh
      - name: Test the launch screen checks
        run: scripts/test-check-launch-screen.sh
      - name: Launch screen checks
        run: scripts/check-launch-screen.sh
      - name: Test the release check of the App Store ID (the check itself runs before a release)
        run: scripts/test-check-app-store-id.sh
      - name: Test the UI test shard check
        run: scripts/test-ui-test-shards.sh
      - name: Every UI test is in exactly one CI shard
        run: scripts/ui-test-shards.sh check
