version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The site's build and check tools (site/package.json; docs/design/nope-site.md, 14.2). Not part
  # of the app. Versions stay exact; a new version is proposed only after 14 days.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
