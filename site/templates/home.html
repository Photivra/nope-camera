<div class="band"><div class="{{wrap}} pt-6 pb-12 md:pt-12 md:pb-16">
<h1 class="leading-none">{{wordmark}}<span class="block mt-3 font-semibold text-full tracking-[-0.01em]">{{fullName}}</span></h1>
<p class="mt-8 font-semibold text-tagline tracking-[-0.01em]">{{tagline}}</p>
<p class="mt-4 max-w-[34rem] text-muted text-lead">{{lead}}</p>
{{get}}
</div></div>
<section class="py-12 md:py-16" aria-labelledby="h-what"><div class="{{wrap}}">
<h2 class="mb-4 font-bold text-h2 tracking-[-0.02em]" id="h-what">{{whatHeading}}</h2>
<p class="max-w-[42rem] text-muted">{{whatIntro}}</p>
<div class="grid gap-x-12 gap-y-10 mt-8 md:grid-cols-2">{{groups}}</div>
</div></section>
<section class="py-12 md:py-16 border-t border-rule" aria-labelledby="h-site"><div class="{{wrap}}">
<h2 class="mb-4 font-bold text-h2 tracking-[-0.02em]" id="h-site">{{siteHeading}}</h2>
<div class="max-w-[46rem] p-6 bg-surface rounded-large forced-colors:border">
<p class="mb-4">{{site1}}</p>
<p class="mb-4">{{site2}}</p>
<p>{{site3}}</p>
</div>
</div></section>
<section class="py-12 md:py-16 border-t border-rule" aria-labelledby="h-need"><div class="{{wrap}}">
<h2 class="mb-4 font-bold text-h2 tracking-[-0.02em]" id="h-need">{{needHeading}}</h2>
<div class="grid gap-x-12 gap-y-8 md:grid-cols-2">
<div><h3 class="mb-2 font-semibold text-h3 tracking-[-0.01em]">{{devicesHeading}}</h3><ul class="list-disc pl-5">{{devices}}</ul><p class="mt-2 text-small">{{deviceList}}</p></div>
<div><h3 class="mb-2 font-semibold text-h3 tracking-[-0.01em]">{{openHeading}}</h3><p class="mb-4">{{license}} {{openCheck}}</p><p>{{openLink}}</p></div>
</div>
</div></section>
