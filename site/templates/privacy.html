<article class="{{doc}}">
<h1>{{title}}</h1>
<p class="hidden print:block">{{address}}</p>
<dl class="{{metaDl}}"><dt class="text-muted">{{effective}}</dt><dd class="m-0 mb-2 last:mb-0 md:mb-0 font-semibold">{{effectiveValue}}</dd><dt class="text-muted">{{updated}}</dt><dd class="m-0 mb-2 last:mb-0 md:mb-0 font-semibold">{{updatedValue}}</dd><dt class="text-muted">{{version}}</dt><dd class="m-0 mb-2 last:mb-0 md:mb-0 font-semibold">{{versionValue}}</dd></dl>
<nav class="mb-8 pb-6 border-b border-rule print:hidden" aria-labelledby="h-toc"><h2 class="mt-0! mb-2! text-nav!" id="h-toc">{{toc}}</h2><ol class="list-decimal pl-5 md:columns-2 gap-x-8 text-small">{{tocItems}}</ol></nav>
{{body}}
</article>
